<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#231733">
<meta name="description" content="スマホで遊べる、のんびり金魚すくい">
<title>のんびり金魚すくい</title>
<style>
:root{--ink:#fff8ec;--panel:rgba(30,22,52,.9);--accent:#ff6f61;--gold:#ffd66b}
html,body{margin:0;height:100%;background:#231733;overflow:hidden;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","M PLUS Rounded 1c","Noto Sans JP",system-ui,sans-serif;color:var(--ink)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#sab{position:fixed;bottom:0;height:env(safe-area-inset-bottom);width:0;pointer-events:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;box-sizing:border-box;
  padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));min-height:52px;pointer-events:none;z-index:2}
#score{font-size:24px;font-weight:800;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.35);min-width:64px}
#score small{font-size:13px;margin-left:2px;opacity:.85}
#poiBox{display:flex;flex-direction:column;gap:4px}
#pois{display:flex;gap:5px}
.pi{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--c);box-sizing:border-box;opacity:.35}
.pi.on{opacity:1;background:rgba(255,255,255,.75)}
.pi.now{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
#bar{width:66px;height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#dur{display:block;height:100%;width:100%;background:#7be08a;border-radius:4px;transition:background .3s}
.hb{pointer-events:auto;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:var(--ink);
  font:inherit;font-size:13px;font-weight:700;padding:8px 12px;min-height:36px}
.hb:active{background:rgba(255,255,255,.28)}
#snd{margin-left:auto}
#end.warn{background:var(--accent)}
#tip{position:fixed;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;
  background:rgba(10,30,60,.55);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;
  white-space:nowrap;transition:opacity .3s;opacity:0}
#tip.show{opacity:1}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
  background:rgba(20,12,36,.45);padding:16px;box-sizing:border-box}
.ov.show{display:flex}
.card{background:var(--panel);border-radius:22px;padding:22px 20px 18px;max-width:360px;width:100%;
  box-sizing:border-box;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);
  max-height:100%;overflow:auto;touch-action:pan-y}
h1{margin:0 0 14px;font-size:30px;line-height:1.2;color:#ffefe0}
h1 span{display:block;font-size:15px;color:var(--gold);letter-spacing:.2em;margin-bottom:2px}
h2{margin:0 0 4px;font-size:22px}
.how{text-align:left;margin:0 0 12px;padding:0;list-style:none;counter-reset:n}
.how li{counter-increment:n;position:relative;padding:7px 0 7px 34px;font-size:14px;line-height:1.5;border-bottom:1px dashed rgba(255,255,255,.12)}
.how li::before{content:counter(n);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.how b{color:var(--gold)}
.note{font-size:12.5px;line-height:1.6;opacity:.85;margin:0 0 10px}
.best{margin:0 0 14px;font-size:14px}
.best b{font-size:18px;color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;
  font-size:18px;font-weight:800;padding:14px;margin-top:8px;box-shadow:0 4px 0 #c24a3f}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c24a3f}
.btn.sub{background:rgba(255,255,255,.14);box-shadow:none;font-size:15px;padding:11px}
.big{margin:6px 0 2px;font-size:16px}
.big b{font-size:42px;color:var(--gold)}
#newRec{margin:0 0 8px;color:#ffb3d0;font-weight:800;font-size:14px;min-height:1em}
#catch{margin:6px 0 4px;text-align:left}
.row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px dashed rgba(255,255,255,.12);font-size:14px}
.row img{width:56px;height:34px}
.row .nm{flex:1}
.row .ct{font-weight:800}
.row .pt{opacity:.7;font-size:12px;width:56px;text-align:right}
.none{opacity:.75;font-size:14px;text-align:center;padding:10px}
#totalO{font-size:13px;opacity:.8;margin:6px 0 4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sab"></div>
<div id="hud">
  <div id="score">0<small>点</small></div>
  <div id="poiBox"><div id="pois"></div><div id="bar"><i id="dur"></i></div></div>
  <button id="snd" class="hb">音 オン</button>
  <button id="end" class="hb">おわる</button>
</div>
<div id="tip"></div>

<div id="title" class="ov show"><div class="card">
  <h1><span>のんびり</span>金魚すくい</h1>
  <ol class="how">
    <li><b>水の上に指を置く</b><br>ポイ(すくう道具)が水に入ります。ポイは指の少し上に出ます。</li>
    <li><b>ゆっくり動かす</b><br>金魚の下にポイをもぐらせます。</li>
    <li><b>指を離す</b><br>すくえたら、下の<b>おわん</b>まで指で運んで離します。</li>
  </ol>
  <p class="note">時間制限はありません。ポイは3本。<br>速く動かしたり、重い金魚をのせたりすると紙が破れやすくなります。</p>
  <p class="best">さいこう記録 <b id="bestT">0</b> 点</p>
  <button id="start" class="btn">はじめる</button>
</div></div>

<div id="over" class="ov"><div class="card">
  <h2>おしまい</h2>
  <p class="big"><b id="scoreO">0</b> 点</p>
  <p id="newRec"></p>
  <div id="catch"></div>
  <p id="totalO"></p>
  <button id="again" class="btn">もういちど</button>
  <button id="toTitle" class="btn sub">タイトルへ</button>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const vibrate=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- 金魚の種類 ---------- */
const TYPES={
  koaka:  {name:'小赤',     pts:10, size:.62,fat:1.0, speed:.9, weight:4, agile:1.0,body:'#ff5a2c',fin:'rgba(255,125,85,.72)'},
  demekin:{name:'黒出目金', pts:30, size:.78,fat:1.25,speed:.55,weight:10,agile:.6, body:'#2c2935',fin:'rgba(48,44,60,.78)'},
  ryukin: {name:'琉金',     pts:50, size:.95,fat:1.5, speed:.6, weight:16,agile:.7, body:'#ff6c3c',fin:'rgba(255,160,120,.62)'},
  kin:    {name:'金色の金魚',pts:200,size:.7, fat:1.05,speed:1.4,weight:6, agile:1.8,body:'#ffc93a',fin:'rgba(255,224,130,.75)'}
};
const ORDER=['kin','ryukin','demekin','koaka'];
const POI_COLORS=['#ff7aa8','#58c6ff','#ffcf4a'];

/* ---------- 状態 ---------- */
let W=0,H=0,R=40,tank,bowl,rest,floorH=140,sab=0;
let fish=[],bowlFish=[],ripples=[],pops=[],lights=[];
let scene='title',score=0,best=store.get('kingyo_best',0),spawnT=0,clock=0,scoops=0;
let activePointer=null,endArmT=0;
const poi={state:'idle',x:0,y:0,tx:0,ty:0,px:0,py:0,spd:0,dur:100,left:3,idx:0,held:[],cracks:[],warned:false,tornT:0,drag:false,rippleT:0};

function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  sab=$('sab').offsetHeight||0;
  const top=$('hud').getBoundingClientRect().bottom+2;
  floorH=clamp(H*.2,120,170);
  tank={x:10,y:top,w:W-20,h:Math.max(120,H-top-floorH-sab)};
  R=clamp(Math.min(tank.w,tank.h)*.13,34,58);
  bowl={x:W/2,y:H-sab-floorH/2-8,r:Math.min(floorH*.36,W*.18,64)};
  rest={x:Math.max(R*.75,W*.13),y:bowl.y-R*.55};
  $('tip').style.bottom=(floorH+sab+12)+'px';
  if(!lights.length)for(let i=0;i<16;i++)lights.push({x:Math.random(),y:Math.random(),r:rnd(.06,.16),vx:rnd(-.02,.02),vy:rnd(-.015,.015)});
  fish.forEach(keepIn);
}
const inTank=p=>p.x>tank.x+R*.3&&p.x<tank.x+tank.w-R*.3&&p.y>tank.y+R*.3&&p.y<tank.y+tank.h-R*.3;
function keepIn(f){const m=R*.35;f.x=clamp(f.x,tank.x+m,tank.x+tank.w-m);f.y=clamp(f.y,tank.y+m,tank.y+tank.h-m)}
// 指の少し上にポイの中心が来る
const poiFromFinger=p=>({x:p.x,y:p.y-R*1.15});

/* ---------- 金魚 ---------- */
function makeSpots(type){
  if((type==='koaka'&&Math.random()<.3)||(type==='ryukin'&&Math.random()<.6)){
    const n=1+(Math.random()*3|0);
    return Array.from({length:n},()=>({x:rnd(-.8,.8),y:rnd(-.9,.9),r:rnd(.3,.6)}));
  }
  return null;
}
function makeFish(type,x,y,a){
  return {type,x,y,a:a??rnd(0,TAU),ta:a??rnd(0,TAU),v:0,tv:TYPES[type].speed*R*.6,t:rnd(0,TAU),timer:rnd(.5,2),spots:makeSpots(type)};
}
function randomType(){const r=Math.random();return r<.66?'koaka':r<.86?'demekin':'ryukin'}
const hasKin=()=>fish.some(f=>f.type==='kin')||poi.held.some(f=>f.type==='kin');
function spawn(fromEdge){
  let type=randomType();
  if(fromEdge&&!hasKin()&&Math.random()<.08)type='kin';
  let x,y,a;
  if(fromEdge){
    const left=Math.random()<.5;
    x=left?tank.x+R*.4:tank.x+tank.w-R*.4;y=rnd(tank.y+R,tank.y+tank.h-R);a=left?0:Math.PI;
  }else{x=rnd(tank.x+R,tank.x+tank.w-R);y=rnd(tank.y+R,tank.y+tank.h-R)}
  fish.push(makeFish(type,x,y,a));
}
function resetFish(){
  fish=[];for(let i=0;i<15;i++)spawn(false);
  if(Math.random()<.4)fish[0]=makeFish('kin',fish[0].x,fish[0].y);
}

function updateFish(dt){
  const cx=tank.x+tank.w/2,cy=tank.y+tank.h/2,m=R*.9;
  for(const f of fish){
    const T=TYPES[f.type];
    f.timer-=dt;
    if(f.timer<=0){
      f.timer=rnd(1.5,4.5);f.ta=f.a+rnd(-1.1,1.1);
      f.tv=T.speed*R*rnd(.35,1.1);if(Math.random()<.22)f.tv*=.15;
    }
    if(f.x<tank.x+m||f.x>tank.x+tank.w-m||f.y<tank.y+m||f.y>tank.y+tank.h-m)
      f.ta=Math.atan2(cy-f.y,cx-f.x)+rnd(-.4,.4);
    // ポイを速く動かすと逃げる(ゆっくりなら逃げない)
    if(poi.state==='water'){
      const dx=f.x-poi.x,dy=f.y-poi.y,d=Math.hypot(dx,dy);
      const thr=f.type==='kin'?1.8:3.4;
      if(d<R*2.2&&poi.spd>thr){f.ta=Math.atan2(dy,dx);f.tv=R*(2.4+T.agile*1.4);f.timer=.7}
    }
    const tr=2.6*T.agile*dt;
    f.a+=clamp(angDiff(f.ta,f.a),-tr,tr);
    f.v+=(f.tv-f.v)*Math.min(1,dt*2.2);
    if(f.tv>T.speed*R*1.5)f.tv+=(T.speed*R*.7-f.tv)*Math.min(1,dt*1.2);
    f.x+=Math.cos(f.a)*f.v*dt;f.y+=Math.sin(f.a)*f.v*dt;
    f.t+=dt*(3+f.v/R*4);
  }
  // 重なりをほどく
  for(let i=0;i<fish.length;i++)for(let j=i+1;j<fish.length;j++){
    const a=fish[i],b=fish[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const min=R*(TYPES[a.type].size+TYPES[b.type].size)*.28;
    if(d<min){const p=(min-d)/d*.5*Math.min(1,dt*6);a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p}
  }
  fish.forEach(keepIn);
}

/* ---------- ポイ ---------- */
function newCracks(){
  return Array.from({length:6},()=>{
    let a=rnd(0,TAU),r=rnd(0,.25);const pts=[[Math.cos(a)*r,Math.sin(a)*r]];
    for(let k=0;k<4;k++){a+=rnd(-.6,.6);r+=rnd(.12,.2);pts.push([Math.cos(a)*r,Math.sin(a)*r])}
    return pts;
  });
}
function newPoi(){
  poi.idx=3-poi.left;poi.dur=100;poi.warned=false;poi.state='idle';poi.held=[];poi.drag=false;poi.cracks=newCracks();
  updateHUD();
}
function wear(x){
  if(poi.state==='torn')return;
  poi.dur-=x;
  if(poi.dur<=30&&!poi.warned){poi.warned=true;vibrate(30);pop(poi.x,poi.y-R*1.3,'やぶれそう…','#ffd0a0')}
  if(poi.dur<=0){poi.dur=0;tear()}
  updateHUD();
}
function dip(c){
  poi.state='water';poi.x=poi.tx=poi.px=c.x;poi.y=poi.ty=poi.py=c.y;poi.spd=0;
  addRipple(c.x,c.y,R*1.5,1);sfx.plop();
  // 真上に入れると近くの金魚が少しおどろく
  for(const f of fish){
    if(Math.hypot(f.x-c.x,f.y-c.y)<R*1.1&&Math.random()<.4){f.ta=Math.atan2(f.y-c.y,f.x-c.x);f.tv=R*2;f.timer=.5}
  }
}
function lift(){
  const caught=fish.filter(f=>Math.hypot(f.x-poi.x,f.y-poi.y)<R*.8);
  addRipple(poi.x,poi.y,R*1.7,1);
  if(!caught.length){poi.state='idle';sfx.splash(.5);return}
  const w=caught.reduce((s,f)=>s+TYPES[f.type].weight,0);
  sfx.splash(1);
  if(poi.dur-w<=0){
    caught.forEach(f=>{f.ta=f.a=Math.atan2(f.y-poi.y,f.x-poi.x);f.tv=R*3;f.timer=.6});
    tear('おもすぎた…');return;
  }
  fish=fish.filter(f=>!caught.includes(f));
  for(const f of caught){f.hx=clamp(f.x-poi.x,-R*.5,R*.5);f.hy=clamp(f.y-poi.y,-R*.5,R*.5)}
  poi.held=caught;poi.state='held';poi.tx=poi.x;poi.ty=poi.y;
  wear(w);
  if(poi.state!=='held')return;
  vibrate(15);
  pop(poi.x,poi.y-R*1.3,caught.length>1?caught.length+'ひき!':'すくえた!','#fff');
}
function dropFish(f,msg){
  f.x=clamp(poi.x+(f.hx||0),tank.x+R*.4,tank.x+tank.w-R*.4);
  f.y=clamp(poi.y+(f.hy||0),tank.y+R*.4,tank.y+tank.h-R*.4);
  f.a=f.ta=rnd(0,TAU);f.tv=R*3;f.timer=.7;
  fish.push(f);addRipple(f.x,f.y,R,.8);
  if(msg){pop(f.x,f.y-R*.6,msg,'#bfe8ff');sfx.plop()}
}
function tear(msg){
  poi.state='torn';poi.tornT=1.4;poi.left--;poi.drag=false;
  const held=poi.held;poi.held=[];held.forEach(f=>dropFish(f));
  vibrate([80,40,80]);sfx.tear();
  pop(poi.x,poi.y-R*1.3,msg||'やぶれた!','#ffb3b3');
  updateHUD();
}
function deposit(){
  let pts=0,gold=false;
  for(const f of poi.held){
    pts+=TYPES[f.type].pts;if(f.type==='kin')gold=true;
    bowlFish.push({type:f.type,spots:f.spots,ph:rnd(0,TAU),rr:rnd(.15,.6),sp:rnd(.35,.75)*(Math.random()<.5?1:-1),t:rnd(0,TAU)});
  }
  score+=pts;scoops++;
  pop(bowl.x,bowl.y-bowl.r-8,'+'+pts,gold?'#ffe066':'#fff');
  gold?sfx.kin():sfx.get();vibrate(20);
  poi.held=[];poi.state='idle';poi.drag=false;
  updateHUD();
}
const overBowl=()=>Math.hypot(poi.x-bowl.x,poi.y-bowl.y)<bowl.r*1.15;

/* ---------- 演出 ---------- */
function addRipple(x,y,max,str){ripples.push({x,y,r:max*.3,max,life:1,str})}
function pop(x,y,text,color){pops.push({x,y,text,color,life:1.3})}

/* ---------- 入力 ---------- */
const ptr=e=>({x:e.clientX,y:e.clientY});
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(scene!=='play'||activePointer!==null)return;
  e.preventDefault();
  const c=poiFromFinger(ptr(e));
  if(poi.state==='idle'){
    if(!inTank(c))return;
    dip(c);
  }else if(poi.state==='held'){
    poi.drag=true;poi.tx=c.x;poi.ty=c.y;
  }else return;
  activePointer=e.pointerId;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==activePointer)return;
  const c=poiFromFinger(ptr(e));
  if(poi.state==='water'){
    poi.tx=clamp(c.x,tank.x+R*.3,tank.x+tank.w-R*.3);poi.ty=clamp(c.y,tank.y+R*.3,tank.y+tank.h-R*.3);
  }else if(poi.state==='held'&&poi.drag){poi.tx=c.x;poi.ty=clamp(c.y,0,H)}
});
function release(e){
  if(e.pointerId!==activePointer)return;
  activePointer=null;
  if(poi.state==='water')lift();
  else if(poi.state==='held'&&poi.drag){
    poi.drag=false;
    // 指を離した位置まで寄せてから判定
    poi.x=poi.tx;poi.y=poi.ty;
    if(overBowl())deposit();
  }
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.card'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- 更新 ---------- */
let tipText='';
function setTip(t){if(t===tipText)return;tipText=t;const el=$('tip');if(t){el.textContent=t;el.classList.add('show')}else el.classList.remove('show')}
function update(dt){
  clock+=dt;
  if(poi.state==='water'||poi.state==='held'){
    const k=1-Math.exp(-dt*(poi.state==='water'?12:20));
    poi.x+=(poi.tx-poi.x)*k;poi.y+=(poi.ty-poi.y)*k;
  }
  const inst=Math.hypot(poi.x-poi.px,poi.y-poi.py)/Math.max(dt,1e-3)/R;
  poi.spd+=(inst-poi.spd)*Math.min(1,dt*10);
  poi.px=poi.x;poi.py=poi.y;

  if(scene==='play'){
    if(poi.state==='water'){
      wear((1+Math.max(0,poi.spd-3)*2.6)*dt);
      poi.rippleT-=dt;
      if(poi.state==='water'&&poi.spd>1.2&&poi.rippleT<=0){poi.rippleT=.13;addRipple(poi.x,poi.y,R*1.15,.5)}
    }else if(poi.state==='held'){
      const w=poi.held.reduce((s,f)=>s+TYPES[f.type].weight,0);
      wear((.3+w*.04)*dt);
      for(let i=poi.held.length-1;i>=0&&poi.state==='held';i--){
        const f=poi.held[i];f.t+=dt*7;
        if(Math.random()<.03*TYPES[f.type].agile*(poi.drag?1.5:1)*dt){poi.held.splice(i,1);dropFish(f,'ぴちっ!')}
      }
      if(poi.state==='held'&&!poi.held.length){poi.state='idle';poi.drag=false}
    }else if(poi.state==='torn'){
      poi.tornT-=dt;
      if(poi.tornT<=0){
        if(poi.left>0){newPoi();pop(rest.x+R*.3,rest.y-R*.9,'新しいポイ','#fff')}
        else endGame();
      }
    }
    spawnT-=dt;
    if(spawnT<=0){spawnT=4.5;if(fish.length<14)spawn(true)}
    if(endArmT>0){endArmT-=dt;if(endArmT<=0){$('end').classList.remove('warn');$('end').textContent='おわる'}}
    setTip(poi.state==='held'?(overBowl()?'ここで指を離す':'おわんまで運んで離そう')
      :poi.state==='water'?'ゆっくり金魚の下へ → 指を離してすくう'
      :poi.state==='idle'&&scoops<2?'水の上に指を置いてね':'');
  }else setTip('');

  updateFish(dt);
  for(const r of ripples){r.life-=dt*1.1;r.r+=(r.max-r.r)*Math.min(1,dt*3)}
  ripples=ripples.filter(r=>r.life>0);
  for(const p of pops){p.life-=dt;p.y-=dt*28}
  pops=pops.filter(p=>p.life>0);
  for(const l of lights){l.x=(l.x+l.vx*dt+1)%1;l.y=(l.y+l.vy*dt+1)%1}
  for(const b of bowlFish){b.ph+=dt*b.sp;b.t+=dt*4}
}

/* ---------- 描画 ---------- */
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function drawFish(c,type,x,y,a,L,t,spots,alpha){
  const T=TYPES[type],rx=L*.3,ry=L*.15*T.fat,wag=Math.sin(t);
  c.save();c.translate(x,y);c.rotate(a);c.globalAlpha=alpha;
  const longTail=type==='ryukin'||type==='demekin';
  const tl=L*(type==='ryukin'?.5:longTail?.42:.4),sw=tl*(longTail?.66:.55);
  c.fillStyle=T.fin;
  c.save();c.translate(-rx*.85,0);c.rotate(wag*.32);
  c.beginPath();c.moveTo(rx*.2,0);
  c.quadraticCurveTo(-tl*.35,-sw*.35,-tl,-sw+wag*sw*.25);
  c.quadraticCurveTo(-tl*.7,wag*sw*.2,-tl,sw+wag*sw*.25);
  c.quadraticCurveTo(-tl*.35,sw*.35,rx*.2,0);c.fill();
  c.restore();
  for(const s of[-1,1]){c.beginPath();c.ellipse(rx*.2,s*ry*.95,ry*.55,ry*.22,s*(.7+wag*.2),0,TAU);c.fill()}
  if(type==='kin'){c.shadowColor='rgba(255,220,90,.9)';c.shadowBlur=L*.3}
  c.fillStyle=T.body;c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.fill();
  c.shadowBlur=0;
  if(spots){
    c.save();c.clip();c.fillStyle='#fff4ea';
    for(const s of spots){c.beginPath();c.ellipse(s.x*rx,s.y*ry,s.r*rx,s.r*ry*1.2,0,0,TAU);c.fill()}
    c.restore();
  }
  c.fillStyle='rgba(255,255,255,.26)';c.beginPath();c.ellipse(-rx*.05,0,rx*.6,ry*.2,0,0,TAU);c.fill();
  for(const s of[-1,1]){
    if(type==='demekin'){
      c.fillStyle='#3d3846';c.beginPath();c.arc(rx*.52,s*ry*.92,ry*.42,0,TAU);c.fill();
      c.fillStyle='#0c0a10';c.beginPath();c.arc(rx*.56,s*ry*.95,ry*.25,0,TAU);c.fill();
    }else{
      c.fillStyle='#1a0d0a';c.beginPath();c.arc(rx*.62,s*ry*.58,Math.max(1.2,ry*.2),0,TAU);c.fill();
    }
  }
  if(type==='kin'&&Math.sin(t*.37)>.7){
    c.fillStyle='rgba(255,255,255,.95)';const sx=rx*.1,sy=-ry*.35,ss=ry*.6;
    c.beginPath();c.moveTo(sx,sy-ss);c.lineTo(sx+ss*.2,sy);c.lineTo(sx,sy+ss);c.lineTo(sx-ss*.2,sy);c.closePath();c.fill();
    c.beginPath();c.moveTo(sx-ss,sy);c.lineTo(sx,sy+ss*.2);c.lineTo(sx+ss,sy);c.lineTo(sx,sy-ss*.2);c.closePath();c.fill();
  }
  c.restore();
}
const fishLen=type=>R*TYPES[type].size*1.55;

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1c40');g.addColorStop(.6,'#2f2034');g.addColorStop(1,'#3b2718');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const lx of[.15,.85]){
    const rg=ctx.createRadialGradient(W*lx,0,0,W*lx,0,W*.6);
    rg.addColorStop(0,'rgba(255,170,90,.28)');rg.addColorStop(1,'rgba(255,170,90,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H*.6);
  }
  // 屋台の床(板)
  const fy=tank.y+tank.h+6;
  ctx.fillStyle='#4a3020';ctx.fillRect(0,fy,W,H-fy);
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;
  for(let y=fy+22;y<H;y+=22){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}

function drawTank(){
  const {x,y,w,h}=tank;
  ctx.save();
  rrect(x,y,w,h,18);
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#5fc8f2');g.addColorStop(1,'#2a86cc');
  ctx.fillStyle=g;ctx.fill();ctx.clip();
  // ゆれる光
  ctx.globalCompositeOperation='lighter';
  for(const l of lights){
    const lx=x+l.x*w,ly=y+l.y*h,lr=l.r*Math.min(w,h)*(1+.15*Math.sin(clock*.8+l.x*9));
    const rg=ctx.createRadialGradient(lx,ly,0,lx,ly,lr);
    rg.addColorStop(0,'rgba(255,255,255,.10)');rg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=rg;ctx.fillRect(lx-lr,ly-lr,lr*2,lr*2);
  }
  ctx.globalCompositeOperation='source-over';
  // 影
  ctx.fillStyle='rgba(0,40,90,.2)';
  for(const f of fish){
    const L=fishLen(f.type);
    ctx.save();ctx.translate(f.x+R*.1,f.y+R*.18);ctx.rotate(f.a);
    ctx.beginPath();ctx.ellipse(0,0,L*.42,L*.15*TYPES[f.type].fat,0,0,TAU);ctx.fill();ctx.restore();
  }
  for(const f of fish)drawFish(ctx,f.type,f.x,f.y,f.a,fishLen(f.type),f.t,f.spots,.93);
  // 波紋
  ctx.lineWidth=1.5;
  for(const r of ripples){
    ctx.strokeStyle=`rgba(255,255,255,${.4*r.life*r.str})`;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
  }
  // 水面のつや
  const sg=ctx.createLinearGradient(0,y,0,y+h*.35);
  sg.addColorStop(0,'rgba(255,255,255,.16)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.fillRect(x,y,w,h*.35);
  ctx.restore();
  // ふち
  rrect(x,y,w,h,18);ctx.lineWidth=7;ctx.strokeStyle='#d6f0ff';ctx.stroke();
  rrect(x+3.5,y+3.5,w-7,h-7,15);ctx.lineWidth=1.5;ctx.strokeStyle='rgba(0,60,120,.35)';ctx.stroke();
}

function drawPoi(x,y,s,mode,alpha=1){
  const r=R*s,col=POI_COLORS[poi.idx%3];
  ctx.save();ctx.globalAlpha=alpha;
  if(mode==='air'){ctx.fillStyle='rgba(0,30,70,.22)';ctx.beginPath();ctx.ellipse(x+r*.25,y+r*.4,r,r*.9,0,0,TAU);ctx.fill()}
  // 持ち手(指の方へ)
  ctx.lineCap='round';
  ctx.strokeStyle=col;ctx.lineWidth=r*.26;
  ctx.beginPath();ctx.moveTo(x,y+r*.95);ctx.lineTo(x,y+r*2.05);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=r*.07;
  ctx.beginPath();ctx.moveTo(x-r*.05,y+r*1.05);ctx.lineTo(x-r*.05,y+r*1.95);ctx.stroke();
  if(mode!=='torn'){
    const wet=mode==='water'?.16+.12*(poi.dur/100):mode==='rest'?.85:.45+.2*(poi.dur/100);
    ctx.fillStyle=`rgba(255,255,255,${wet})`;
    ctx.beginPath();ctx.arc(x,y,r*.94,0,TAU);ctx.fill();
    if(poi.dur<40&&mode!=='rest'){
      const n=Math.ceil((40-poi.dur)/40*poi.cracks.length);
      ctx.strokeStyle='rgba(110,80,70,.65)';ctx.lineWidth=1.3;
      for(let i=0;i<n;i++){
        const pts=poi.cracks[i];ctx.beginPath();
        pts.forEach(([px,py],k)=>k?ctx.lineTo(x+px*r,y+py*r):ctx.moveTo(x+px*r,y+py*r));ctx.stroke();
      }
    }
  }else{
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<6;i++){
      const a0=i*TAU/6+.3,a1=a0+.5;
      ctx.beginPath();ctx.arc(x,y,r*.94,a0,a1);ctx.lineTo(x+Math.cos(a0+.25)*r*.62,y+Math.sin(a0+.25)*r*.62);ctx.closePath();ctx.fill();
    }
  }
  // 枠
  ctx.lineWidth=r*.14;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();
  ctx.lineWidth=r*.04;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(x,y,r*1.01,Math.PI*1.1,Math.PI*1.6);ctx.stroke();
  ctx.restore();
}

function drawBowl(){
  const {x,y,r}=bowl;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+4,y+r*.12+6,r*1.02,r*.95,0,0,TAU);ctx.fill();
  if(poi.state==='held'){
    const on=overBowl(),pulse=.5+.5*Math.sin(clock*6);
    ctx.strokeStyle=on?'rgba(255,230,110,.95)':`rgba(255,230,110,${.3+.4*pulse})`;
    ctx.lineWidth=on?6:4;ctx.beginPath();ctx.arc(x,y,r+8+(on?0:pulse*4),0,TAU);ctx.stroke();
  }
  ctx.fillStyle='#f4f7fb';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.strokeStyle='#c4d3e2';ctx.lineWidth=2;ctx.stroke();
  const g=ctx.createRadialGradient(x-r*.2,y-r*.2,r*.1,x,y,r*.84);
  g.addColorStop(0,'#b7e7fb');g.addColorStop(1,'#5db4e4');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*.84,0,TAU);ctx.fill();
  ctx.save();ctx.clip();
  const show=bowlFish.slice(-40);
  for(const b of show){
    const rr=r*.84*b.rr*1.3,fx=x+Math.cos(b.ph)*rr,fy=y+Math.sin(b.ph)*rr;
    drawFish(ctx,b.type,fx,fy,b.ph+(b.sp>0?Math.PI/2:-Math.PI/2),fishLen(b.type)*.5,b.t,b.spots,1);
  }
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*.92,Math.PI*1.1,Math.PI*1.45);ctx.stroke();
  ctx.fillStyle='rgba(255,248,236,.85)';ctx.font='700 12px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText(bowlFish.length?`おわん ${bowlFish.length}ひき`:'おわん',x,y+r+15);
  ctx.restore();
}

function drawPops(){
  ctx.textAlign='center';ctx.lineJoin='round';
  for(const p of pops){
    ctx.globalAlpha=Math.min(1,p.life*1.5);
    ctx.font='800 18px system-ui,sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(20,20,50,.7)';ctx.strokeText(p.text,p.x,p.y);
    ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
}

function draw(){
  drawBackground();
  drawTank();
  drawBowl();
  if(scene==='play'){
    if(poi.state==='idle')drawPoi(rest.x,rest.y,.6,'rest');
    else if(poi.state==='water'){
      const ready=fish.some(f=>Math.hypot(f.x-poi.x,f.y-poi.y)<R*.8);
      drawPoi(poi.x,poi.y,1,'water');
      if(ready){ctx.strokeStyle=`rgba(255,250,200,${.5+.3*Math.sin(clock*8)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(poi.x,poi.y,R*.8,0,TAU);ctx.stroke()}
    }else if(poi.state==='held'){
      drawPoi(poi.x,poi.y,1.05,'air');
      for(const f of poi.held)drawFish(ctx,f.type,poi.x+f.hx,poi.y+f.hy,f.a+Math.sin(f.t)*.35,fishLen(f.type),f.t*1.6,f.spots,1);
    }else if(poi.state==='torn')drawPoi(poi.x,poi.y,1,'torn',clamp(poi.tornT,0,1));
  }
  drawPops();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}

/* ---------- 画面の切りかえ ---------- */
function updateHUD(){
  $('score').innerHTML=score+'<small>点</small>';
  const box=$('pois');box.innerHTML='';
  for(let i=0;i<3;i++){
    const d=document.createElement('i');d.className='pi';d.style.setProperty('--c',POI_COLORS[i]);
    const used=3-poi.left,current=poi.state==='torn'?-1:used;
    if(i>=used)d.classList.add('on');if(i===current)d.classList.add('now');
    box.appendChild(d);
  }
  const p=poi.state==='torn'?0:clamp(poi.dur,0,100);
  $('dur').style.width=p+'%';
  $('dur').style.background=p>60?'#7be08a':p>30?'#ffd166':'#ff7b6b';
}
function startGame(){
  score=0;scoops=0;bowlFish=[];poi.left=3;poi.held=[];newPoi();resetFish();spawnT=4;
  ripples=[];pops=[];activePointer=null;endArmT=0;$('end').classList.remove('warn');$('end').textContent='おわる';
  scene='play';$('title').classList.remove('show');$('over').classList.remove('show');
  $('hud').style.visibility='visible';
  updateHUD();
}
function fishIcon(type){
  const c=document.createElement('canvas');c.width=112;c.height=68;const g=c.getContext('2d');
  const save=R;R=48;drawFish(g,type,62,34,0,R*TYPES[type].size*1.55*.95,1,null,1);R=save;
  return c.toDataURL();
}
const icons={};
function endGame(){
  if(scene!=='play')return;
  scene='over';activePointer=null;
  if(poi.held.length){const h=poi.held;poi.held=[];h.forEach(f=>dropFish(f))}
  poi.state='idle';
  const rec=score>best&&score>0;
  if(rec){best=score;store.set('kingyo_best',best)}
  $('scoreO').textContent=score;
  $('newRec').textContent=rec?'さいこう記録!':'さいこう記録 '+best+' 点';
  const counts={};bowlFish.forEach(b=>counts[b.type]=(counts[b.type]||0)+1);
  const box=$('catch');box.innerHTML='';
  if(!bowlFish.length)box.innerHTML='<div class="none">今回はすくえませんでした。<br>ゆっくり動かすのがコツです。</div>';
  for(const t of ORDER){
    if(!counts[t])continue;
    icons[t]=icons[t]||fishIcon(t);
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<img alt="" src="${icons[t]}"><span class="nm">${TYPES[t].name}</span><span class="ct">${counts[t]}ひき</span><span class="pt">${counts[t]*TYPES[t].pts}点</span>`;
    box.appendChild(row);
  }
  $('totalO').textContent=bowlFish.length?`ぜんぶで ${bowlFish.length} ひき`:'';
  $('over').classList.add('show');
  setTip('');
  if(rec)sfx.kin();
}
function showTitle(){
  scene='title';$('over').classList.remove('show');$('title').classList.add('show');
  $('bestT').textContent=best;$('hud').style.visibility='hidden';
}
$('start').onclick=()=>{ensureAudio();startGame()};
$('again').onclick=()=>{ensureAudio();startGame()};
$('toTitle').onclick=showTitle;
$('end').onclick=()=>{
  if(scene!=='play')return;
  if(endArmT>0){endGame();return}
  endArmT=2.5;$('end').classList.add('warn');$('end').textContent='もう一度で終了';
};

/* ---------- 音(その場で合成) ---------- */
let AC=null,master=null,noiseBuf=null,soundOn=store.get('kingyo_sound',true);
function ensureAudio(){
  if(!AC){
    try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=soundOn?.9:0;master.connect(AC.destination)}
    catch(e){AC=null}
  }
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d,type,vol,slide,when){
  if(!AC)return;const t=when||AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,vol,freq,ftype,when){
  if(!AC)return;const t=when||AC.currentTime;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type=ftype;fl.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+d+.03);
}
const sfx={
  plop(){tone(620,.13,'sine',.22,170);noise(.08,.07,1100,'lowpass')},
  splash(s=1){noise(.3*s+.05,.16*s,900,'lowpass');tone(420,.16,'sine',.1*s,140)},
  tear(){noise(.2,.32,2600,'highpass');noise(.12,.2,4200,'bandpass')},
  get(){tone(880,.14,'triangle',.18);if(AC)tone(1318.5,.22,'triangle',.15,null,AC.currentTime+.09)},
  kin(){if(!AC)return;[784,988,1175,1568].forEach((f,i)=>tone(f,.25,'triangle',.15,null,AC.currentTime+i*.08))}
};
// のんびりしたお祭りBGM(ヨナ抜き音階)
const SCALE=[293.66,329.63,392,440,493.88,587.33,659.25];
const MEL=[0,2,3,-1,4,3,2,-1, 1,2,0,-1,-1,-1,-1,-1, 3,4,5,4,3,-1,2,-1, 1,0,1,2,0,-1,-1,-1,
           5,-1,4,3,4,-1,2,-1, 3,2,1,-1,2,-1,-1,-1, 0,1,2,3,4,3,2,-1, 1,2,0,-1,-1,-1,-1,-1];
let bgmStep=0,bgmNext=0;
setInterval(()=>{
  if(!AC||!soundOn||AC.state!=='running'||document.hidden)return;
  if(bgmNext<AC.currentTime)bgmNext=AC.currentTime+.05;
  while(bgmNext<AC.currentTime+.35){
    const n=MEL[bgmStep%MEL.length];
    if(n>=0)tone(SCALE[n],.55,'triangle',.04,null,bgmNext);
    if(bgmStep%8===0)tone(98,.4,'sine',.09,65,bgmNext);
    if(bgmStep%8===4)tone(147,.22,'sine',.04,110,bgmNext);
    bgmNext+=.36;bgmStep++;
  }
},100);
function setSound(on){
  soundOn=on;store.set('kingyo_sound',on);$('snd').textContent=on?'音 オン':'音 オフ';
  if(master)master.gain.value=on?.9:0;
}
$('snd').onclick=()=>{ensureAudio();setSound(!soundOn)};
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});

/* ---------- 開始 ---------- */
addEventListener('resize',resize);
resize();resetFish();setSound(soundOn);showTitle();updateHUD();
requestAnimationFrame(frame);
</script>
