  forfeit:()=>{if(B&&(B.cup||B.tower)&&B.phase==='input'){log('棄権した……');lose();}},
  sento:()=>{const t=TOWN[state.town];if(state.yen<t.sentoP)return;state.yen-=t.sentoP;healAll();ui.toast=`${t.sento}でひとっ風呂。なかま全員が回復した！`;sfx('heal');save();render();},
  lure:()=>{if(!(state.items.kirakira>0))return;state.items.kirakira--;state.lure=(state.lure||0)+10;ui.toast='きらきらの砂をまいた。しばらくメタル系に出会いやすくなる！';sfx('shiny');save();render();},
  care:()=>{const m=findMon(ui.sel);if(!m||!state.box.includes(m))return;state.daycare=careList();const i=state.daycare.indexOf(m.uid);if(i>=0)state.daycare.splice(i,1);else if(state.daycare.length<2)state.daycare.push(m.uid);save();render();},
  sort:d=>{ui.sort=d.v;render();},
  transfer:()=>{ui.transfer=!ui.transfer;ui.tcode='';ui.tmsg='';ui.tin='';ui.terr='';ui.tconfirm=false;render();if(ui.transfer){const el=document.getElementById('transfer');if(el)el.scrollIntoView({block:'start'});}},
  makeCode:()=>{ui.tcode=saveCode();ui.tmsg=`コードを作りました(${ui.tcode.length.toLocaleString()}文字)`;render();},
  copyCode:()=>{
    const el=document.getElementById('exportCode'),msg=document.getElementById('copyMsg');
    const fall=()=>{if(el){el.focus();el.select();}if(msg)msg.textContent='自動でコピーできませんでした。選択された文字を長押し(右クリック)でコピーしてください。';};
    try{navigator.clipboard.writeText(ui.tcode).then(()=>{if(msg)msg.textContent='コピーしました。自分あてに送って、もう一方の端末で貼りつけてください。';},fall);}catch(e){fall();}
  },
  importAsk:()=>{const el=document.getElementById('importCode');ui.tin=el?el.value:'';ui.terr='';try{readCode(ui.tin);ui.tconfirm=true;}catch(e){ui.terr=e.message;}render();},
  importCancel:()=>{ui.tconfirm=false;ui.tfile='';render();},
  cloudNow:async()=>{ui.cmsg='';save();await cloudPush();ui.cmsg=CLOUD.status==='ok'?'クラウドに保存しました。':'保存できませんでした: '+cloudStatusText();render();},
  bkSave:async()=>{if(!CLOUD.db)return;ui.cmsg='バックアップ中…';render();try{save();await cloudWrite('backup');CLOUD.bk=(await cloudRef('backup').get()).data();ui.cmsg='バックアップを作りました。';}catch(e){ui.cmsg='バックアップに失敗しました。少し待ってからもう一度ためしてください。';}render();},
  bkLoad:async()=>{if(!CLOUD.db||!CLOUD.bk)return;if(!ui.bkAsk){ui.bkAsk=true;render();return;}try{const o=await unpackState((await cloudRef('backup').get()).data());if(!o)throw 0;o.savedAt=Date.now();adoptState(o,'バックアップから戻しました。');cloudPush();}catch(e){ui.bkAsk=false;ui.cmsg='バックアップを読み込めませんでした。';render();}},
  bkCancel:()=>{ui.bkAsk=false;render();},
  fileSave:async()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');save();const fn=`jengarua-save-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`,data=JSON.stringify(state);
    if(CLOUD.dl){try{await CLOUD.dl.save({filename:fn,data});ui.cmsg='ファイルに保存しました。';}catch(e){ui.cmsg=e&&e.code==='declined'?'':'ファイルに保存できませんでした。引き継ぎコードを使ってください。';}render();return;}
    try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ui.cmsg=`「${fn}」を保存しました(ダウンロードフォルダ)。`;}catch(e){ui.cmsg='ファイルに保存できませんでした。引き継ぎコードを使ってください。';}render();},
  importCode:()=>{
    try{const o=readCode(ui.tin);state=o;B=null;migrate();save();ui.tfile='';
      Object.assign(ui,{tab:'map',sel:null,bA:null,bB:null,bSlot:'A',inh:[],trs:[],confirmRel:false,dexSel:null,result:null,confirmReset:false,dlg:null,renaming:false,cats:[],transfer:false,tconfirm:false,tin:'',tcode:'',terr:''});
      ui.toast=`データを引き継ぎました。ようこそ、${TOWN[state.town].name}へ！`;render();window.scrollTo(0,0);
    }catch(e){ui.terr=e.message;ui.tconfirm=false;render();}
  },
  dtab:d=>{ui.dtab=d.v;render();},
  detailClose:()=>{ui.detailOpen=false;ui.renaming=false;render();},
  boxFam:d=>{ui.boxFam=d.v;render();},
  toBreed:()=>{const m=findMon(ui.sel);if(!m||m.lv<10)return;if(ui.bB===m.uid)ui.bB=null;ui.bA=m.uid;ui.bSlot=ui.bB==null?'B':'A';ui.inh=[];ui.trs=[];ui.btab='pick';ui.tab='breed';ui.detailOpen=false;render();window.scrollTo(0,0);},
  btab:d=>{ui.btab=d.v;render();},
  bswap:()=>{const x=ui.bA;ui.bA=ui.bB;ui.bB=x;ui.inh=[];ui.trs=[];sfx('sel');render();},
  gpull:d=>{ui.gacha=null;gachaPull(+d.n);},
  gclose:()=>{ui.gacha=null;render();},
  gview:()=>{const u=ui.gacha&&ui.gacha.list[0];ui.gacha=null;ui.tab='party';if(u)ui.sel=u.uid;ui.detailOpen=true;render();window.scrollTo(0,0);},
  mission:d=>{dailyRoll();const x=MISSIONS.find(q=>q.k===d.k);if(!x||state.daily.got[x.k]||missionVal(x.k)<x.goal)return;state.daily.got[x.k]=true;addStars(x.rw);ui.toast=`デイリーミッション達成！ 流星石★${x.rw}`;sfx('win');save();render();},
  tower:d=>startTower(+d.n),
  xchg:()=>{const t=dayKey();if(!state.xchg||state.xchg.d!==t)state.xchg={d:t,n:0};if(state.xchg.n>=5||state.yen<10000)return;state.yen-=10000;state.xchg.n++;addStars(20);sfx('sel');save();render();},
  awaken0:()=>{ui.awakeAsk=null;render();},
  awaken:()=>{const m=findMon(ui.sel);if(!m)return;const ev=SP[m.sp].evo;if(!ev||m.lv<80||!(state.items.kakusei>0))return;if(ui.awakeAsk!==m.uid){ui.awakeAsk=m.uid;render();return;}
    const before=SP[m.sp].name;state.items.kakusei--;m.sp=ev;m.traits=m.traits.map(t=>t==='shishin'?'sousei':t);if(!m.traits.includes('sousei'))m.traits[0]='sousei';learn(m);const st=calc(m);m.hp=st.hp;m.mp=st.mp;state.owned[ev]=true;state.seen[ev]=true;if(m.shiny)state.shinySeen[ev]=true;ui.awakeAsk=null;sfx('shiny');save();render();
    talk([['',`${before}が、まばゆい光につつまれた……！`],['',`${SP[ev].name}に覚醒した！ 創世ランクになり、レベル上限が${capLv(m)}になった。`]]);},
  bclear:()=>{ui.bA=ui.bB=null;ui.bSlot='A';ui.inh=[];ui.trs=[];ui.cats=[];ui.btab='pick';render();},
  bset:d=>{ui.bA=+d.a;ui.bB=+d.b;ui.bSlot='B';ui.inh=[];ui.trs=[];ui.btab='set';render();window.scrollTo(0,0);},
  bFam:d=>{ui.bFam=d.v;render();},
  bAllLv:()=>{ui.bAllLv=!ui.bAllLv;render();},
  bNew:()=>{ui.bNew=!ui.bNew;render();},
  rest:()=>{advanceTime();ui.toast=`ベンチでひと休み。${TIMES[state.time].n}になった。`;save();render();},
  req:d=>{const r=REQUESTS.find(x=>x.id===d.id);if(!r||state.reqDone[r.id])return;const m=reqMatch(r.need);if(!m)return;state.reqDone[r.id]=true;addStars(30);const got=giveReward(r.reward)+'・流星石★30';sfx('win');save();talk([[r.from,m.dex?'すごい記録ですね！ お礼を受け取ってください。':`${mName(m)}……！ 見せてくれてありがとう。これはお礼です。`],['',`${got} を受け取った。`]]);},
  dexms:d=>{const n=+d.n,x=DEX_MS.find(q=>q.n===n),own=dexList().filter(s=>state.owned[s.id]).length;if(!x||state.dexClaim[n]||own<n)return;state.dexClaim[n]=true;addStars(100);ui.toast=`図鑑の記念品として ${giveReward(x.reward)} を受け取った！`;sfx('win');save();render();},
  sound:()=>{state.sound=!state.sound;save();render();sfx('sel');},
  bgm:()=>{state.bgm=!state.bgm;if(state.bgm){try{bgmCtx().resume();}catch(e){}}else bgmStop(),BGM.cur=null;save();render();},
  dlgNext:()=>{const d=ui.dlg;if(!d)return;d.i++;if(d.i>=d.lines.length){const cb=d.cb;ui.dlg=null;render();if(cb)cb();}else render();},
  rename:()=>{ui.renaming=true;render();const el=document.getElementById('nick');if(el){el.focus();el.select();}},
  renameCancel:()=>{ui.renaming=false;render();},
  sel:d=>{ui.sel=+d.uid;ui.confirmRel=false;ui.renaming=false;ui.detailOpen=true;render();},
  gosel:d=>{ui.sel=+d.uid;ui.tab='party';ui.toast='';ui.detailOpen=true;ui.renaming=false;render();window.scrollTo(0,0);},
  toBox:()=>{const m=findMon(ui.sel);if(!m||state.party.length<=1)return;state.party=state.party.filter(x=>x!==m);state.box.unshift(m);save();render();},
  toParty:()=>{const m=findMon(ui.sel);if(!m||state.party.length>=3)return;state.box=state.box.filter(x=>x!==m);state.party.push(m);save();render();},
  useItem:d=>{const m=findMon(ui.sel);if(!m||!state.items[d.id])return;const s=calc(m);
    if(d.id==='bansoko'){if(m.hp>=s.hp)return;m.hp=Math.min(s.hp,m.hp+45);}else{if(m.mp>=s.mp)return;m.mp=Math.min(s.mp,m.mp+20);}
    state.items[d.id]--;sfx('heal');save();render();},
  release1:()=>{ui.confirmRel=true;render();},
  release0:()=>{ui.confirmRel=false;render();},
  release2:()=>{const m=findMon(ui.sel);if(!m||allMons().length<=1)return;removeMon(m);if(!state.party.length&&state.box.length)state.party.push(state.box.shift());ui.toast=`${mName(m)}を野にかえした。`;ui.sel=null;ui.confirmRel=false;save();render();},
  bslot:d=>{ui.bSlot=d.v;render();},
  bpick:d=>{const u=+d.uid;if(ui.bSlot==='A'){ui.bA=u;if(ui.bB==null)ui.bSlot='B';}else{ui.bB=u;if(ui.bA==null)ui.bSlot='A';}ui.inh=[];ui.trs=[];if(ui.bA!=null&&ui.bB!=null)ui.btab='set';render();},
  inh:d=>{const i=ui.inh.indexOf(d.id);if(i>=0)ui.inh.splice(i,1);else ui.inh.push(d.id);render();},
  trs:d=>{const i=ui.trs.indexOf(d.id);if(i>=0)ui.trs.splice(i,1);else ui.trs.push(d.id);render();},
  breed:()=>doBreed(),
  cat:d=>{ui.cats=ui.cats||[];const i=ui.cats.indexOf(d.id);if(i>=0)ui.cats.splice(i,1);else if(ui.cats.length<CATMAX)ui.cats.push(d.id);render();},
  seeChild:()=>{ui.sel=ui.result.uid;ui.result=null;ui.tab='party';render();window.scrollTo(0,0);},
  closeResult:()=>{ui.result=null;render();},
  dex:d=>{ui.dexSel=d.id;render();window.scrollTo(0,0);},
  buy:d=>{const it=ITEMS[d.id];if(state.yen<it.p)return;state.yen-=it.p;state.items[d.id]=(state.items[d.id]||0)+1;sfx('sel');save();render();},
  reset1:()=>{ui.confirmReset=true;render();},
  reset0:()=>{ui.confirmReset=false;render();},
  reset2:()=>{if(CLOUD.db)cloudRef('main').delete().catch(()=>{});state=fresh();B=null;Object.assign(ui,{tab:'map',sel:null,bA:null,bB:null,bSlot:'A',inh:[],trs:[],toast:'',confirmRel:false,dexSel:null,result:null,confirmReset:false,dlg:null,renaming:false,cats:[]});save();render();},
  tgt:d=>{if(!B)return;B.target=+d.i;render();},
  catk:()=>setCmd({k:'atk',tgt:B.target}),
  cguard:()=>setCmd({k:'guard'}),
  cguardAll:()=>{if(!B||B.phase!=='input')return;for(let i=B.inputIdx;i<B.allies.length;i++)if(alive(B.allies[i]))B.cmds[i]={k:'guard'};runTurn();},
  cmenu:d=>{B.menu=d.v;render();},
  csk:d=>setCmd({k:'sk',id:d.id,tgt:B.target}),
  citem:d=>setCmd({k:'item',id:d.id}),
  cback:()=>cmdBack(),
  cauto:()=>autoTurn(),
  autoT:()=>{B.auto=!B.auto;if(B.auto&&B.phase==='input')autoTurn();else render();},
  scout:()=>runTurn('scout'),
  flee:()=>runTurn('flee'),
  bendStop:()=>{if(B)B.next=null;H.bend();},
  bend:()=>{if(B&&B.next){const n=B.next;if(n.tower){B=null;startTower(n.tower);return;}startCup(n.id,n.round);return;}const after=B&&B.after;B=null;render();window.scrollTo(0,0);if(after)after();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=H[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('change',e=>{
  if(e.target.id!=='fileLoad'||!e.target.files||!e.target.files[0])return;
  const f=e.target.files[0];f.text().then(t=>{ui.tin=t;ui.tfile=f.name;ui.terr='';try{readCode(t);ui.tconfirm=true;}catch(er){ui.terr=er.message;ui.tconfirm=false;}render();});
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='rename')return;
  e.preventDefault();
  const m=findMon(ui.sel),inp=document.getElementById('nick'),v=(inp?inp.value:'').trim().slice(0,8);
  if(m){if(v&&v!==SP[m.sp].name)m.nick=v;else delete m.nick;}
  ui.renaming=false;save();render();
});

/* ========== 起動 ========== */
/* 古いセーブデータを今の形にそろえる */
function migrate(){
  const fix=n=>n&&('par' in n)?{sp:n.sp,plus:0,sh:false,p:n.par?n.par.map(s=>({sp:s,plus:0,sh:false,p:null})):null}:n;
  allMons().forEach(m=>{if(m.parents)m.parents=m.parents.map(fix);if(m.gen==null)m.gen=m.parents?1:0;});
  const d={time:1,steps:0,reqDone:{},cups:{},rival:{},flags:{},shinySeen:{},dexClaim:{},sound:false,lure:0,daycare:[]};
  if(state.bgm==null)state.bgm=true;
  if(state.stars==null)state.stars=0;
  for(const k in d)if(state[k]==null)state[k]=d[k];
  allMons().forEach(m=>{if(m.shiny)state.shinySeen[m.sp]=true;});
  if(state.started)state.flags.intro=true;
}
function start(data){
  state=(data&&data.state)||load()||fresh();
  if(!state.items)state.items={bansoko:0,tea:0,drink:0,onigiri:0};
  migrate();
  render();
  cloudInit();
  if(state.started&&!state.flags.v2){state.flags.v2=true;save();talk(STORY.v2news,()=>gachaRetro());}
  else if(state.started&&!state.flags.gacha)gachaRetro();
  if(state.started){const lb=loginBonus();if(lb){ui.toast=`ログインボーナス ★${lb.g}(${lb.streak}日連続${lb.streak%7===0?' ・ 7日ごとのボーナス！':''})`;render();}}
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({state}));}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
