<title>ジェンガルア配合録</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 夜のローカル線。上に路線図、その下に駅名標つきの情景、町の施設と探索先をカードで並べる。戦闘と会話は白い二重枠のRPGウィンドウ */
:root{
  --bg:#0c1120; --bg2:#111829; --panel:#161f35; --panel2:#1d2843; --line:#2a3658; --line2:#3a4872;
  --ink:#eaeef7; --muted:#95a2bd; --faint:#5c6886;
  --accent:#f2b13c; --accent-ink:#1b1404; --danger:#ec6a5e; --good:#5ccb8f; --info:#7fc3f2; --violet:#b9a3f2;
  --plate:#f4f2eb; --plate-ink:#1b2133; --win:#0a0f1c;
  --f-disp:'DotGothic16','Zen Kaku Gothic New',system-ui,sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-seal:'Zen Antique','Yu Mincho','Hiragino Mincho ProN',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1100px 520px at 50% -260px,#1c2a52 0%,transparent 70%),var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100%}
button,input{font:inherit;color:inherit}
p{margin:0}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-disp);font-size:12px;letter-spacing:.14em;color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(28px,6vw,44px)} h2{font-size:24px} h3{font-size:18px} h4{font-size:14px;color:var(--muted);letter-spacing:.08em}
.logo{font-family:var(--f-disp);letter-spacing:.06em;color:var(--ink);text-shadow:0 2px 0 #000,0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo.sm{font-size:clamp(20px,4vw,26px);display:block}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.hl{color:var(--accent)}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel) 90px);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--ink) 6%,transparent)}
.win{background:var(--win);border:2px solid var(--ink);border-radius:8px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line2),0 10px 30px -10px #000;padding:12px 16px}
.stack{display:flex;flex-direction:column;gap:12px} .stack.tight{gap:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .row.between{justify-content:space-between} .row.center{justify-content:center}
.sec{font-size:16px;color:var(--muted);letter-spacing:.08em}
.desc{max-width:64ch}

/* ヘッダー */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-disp)}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--tc);color:var(--tc);font-size:13px}
.tchip i{width:8px;height:8px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc)}
.loc{color:var(--muted);font-size:13px}
.yen{font-weight:400;font-size:22px;color:var(--accent)} .yen small{font-size:13px;margin-left:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab{position:relative;flex:1 0 auto;min-width:64px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:var(--f-disp);font-size:15px;cursor:pointer;color:var(--muted);transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink);border-color:var(--line2)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 45%,#000)}
.ndot{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-style:normal;font-size:11px;line-height:18px;padding:0 5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-family:var(--f-disp);font-size:15px;transition:transform .08s,border-color .15s,background .15s;box-shadow:0 3px 0 #070a14}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #070a14}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 45%,#000)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#1a0705;box-shadow:0 3px 0 color-mix(in srgb,var(--danger) 45%,#000)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.toast{background:var(--win);border:2px solid var(--accent);border-radius:8px;padding:10px 14px;font-family:var(--f-disp);animation:slideIn .3s ease-out}
@keyframes slideIn{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.badge{display:inline-block;font-family:var(--f-disp);font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.good{color:var(--good)} .badge.warn{color:var(--danger)} .badge.acc{color:var(--accent)}
.tag{display:inline-block;font-family:var(--f-disp);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--line);color:var(--ink);letter-spacing:.06em}
.tag.warn{background:var(--danger);color:#1a0705}

/* 印(モンスター) */
.seal{--s:76px;--i:48px;--fam:var(--faint);position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-family:var(--f-seal);font-size:calc(var(--s)*.5);line-height:1;color:var(--fam);
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--fam) 26%,var(--panel2)),var(--bg2) 75%);
  box-shadow:inset 0 0 0 2px var(--fam),inset 0 0 0 5px var(--bg2),inset 0 0 0 6px color-mix(in srgb,var(--fam) 50%,transparent)}
.seal.sm{--s:54px;--i:48px} .seal.xs{--s:34px;--i:24px} .seal.lg{--s:108px;--i:96px} .seal.xl{--s:204px;--i:192px}
.seal.sm img.spr{image-rendering:auto}
@media (max-width:560px){.seal.xl{--s:120px;--i:96px}}
.seal img.spr{width:var(--i);height:var(--i);image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 2px 0 color-mix(in srgb,var(--bg) 60%,transparent))}
.seal.xs img.spr{image-rendering:auto}
.seal img.art{width:calc(var(--s) - 6px);height:calc(var(--s) - 6px);border-radius:50%;object-fit:cover;-webkit-mask:radial-gradient(circle at 50% 50%,#000 58%,transparent 71%);mask:radial-gradient(circle at 50% 50%,#000 58%,transparent 71%)}
.seal img.art.shiny{filter:hue-rotate(150deg) saturate(1.4)}
.bc.foe img.art{animation:none}
.seal img.spr.shiny{filter:hue-rotate(150deg) saturate(1.5) drop-shadow(0 2px 0 color-mix(in srgb,var(--bg) 60%,transparent))}
.seal.sh::after{content:"✦";position:absolute;right:-4px;bottom:-4px;color:var(--accent);font-size:15px;line-height:1;text-shadow:0 0 6px var(--accent);animation:twinkle 1.6s ease-in-out infinite}
.seal.xs.sh::after{font-size:10px;right:-2px;bottom:-2px}
@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}
.seal .rk{position:absolute;top:-3px;right:-6px;font-family:var(--f-disp);font-size:11px;line-height:1;padding:3px 4px;border-radius:4px;background:var(--fam);color:var(--bg)}
.seal.xs .rk{display:none}
.seal .gl{position:absolute;left:-4px;bottom:-2px;font-style:normal;font-family:var(--f-seal);font-size:14px;line-height:1;padding:3px;border-radius:3px;background:var(--danger);color:var(--bg)}
.seal.xl .gl{font-size:18px}

/* 情景と駅名標 */
.hero{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.hero img.scene{display:block;width:100%;height:clamp(150px,26vw,230px);object-fit:cover;image-rendering:pixelated}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,color-mix(in srgb,var(--bg) 70%,transparent));pointer-events:none}
.hero-title{position:absolute;left:20px;bottom:16px;z-index:1;display:flex;flex-direction:column;gap:4px}
.plate{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:1;width:min(440px,calc(100% - 28px));background:var(--plate);color:var(--plate-ink);border-radius:6px;box-shadow:0 6px 0 #0006,0 0 0 2px #0003;overflow:hidden}
.plate-main{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px 6px}
.plate .code{font-family:var(--f-disp);font-size:13px;border:2px solid var(--plate-ink);border-radius:6px;padding:2px 6px;line-height:1.1;text-align:center}
.plate-name{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.plate-name b{font-family:var(--f-disp);font-weight:400;font-size:clamp(22px,4.5vw,30px);letter-spacing:.12em}
.plate .roma{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#4a5068}
.plate-bar{display:flex;justify-content:space-between;background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:12px;padding:2px 10px;min-height:20px}

/* 路線図 */
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));padding-top:4px}
.rail::before{content:"";position:absolute;left:calc(50% / var(--n,5));right:calc(50% / var(--n,5));top:18px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,color-mix(in srgb,var(--accent) 70%,#000) 14px 16px);opacity:.7}
.station{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;cursor:pointer;padding:0 2px;text-align:center}
.station .dot{width:34px;height:34px;border-radius:50%;background:var(--bg);border:5px solid var(--accent);display:grid;place-items:center;font-family:var(--f-disp);font-size:11px;z-index:1;transition:transform .15s}
.station:hover:not(:disabled) .dot{transform:scale(1.1)}
.station.cur .dot{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.station.locked{cursor:not-allowed;color:var(--faint)}
.station.locked .dot{border-color:var(--faint);color:var(--faint)}
.station .sn{font-family:var(--f-disp);font-size:15px;margin-top:6px}
.station .sk{font-size:11px;color:var(--muted)}

.town-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.timebar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.timebar span{font-family:var(--f-disp);font-size:13px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--faint)}
.timebar span.on{color:var(--tc);border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.timebar .btn{margin-left:auto}
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:12px}
.field .thumb{width:100%;height:100%;min-height:110px;object-fit:cover;border-radius:8px;image-rendering:pixelated;border:1px solid var(--line)}
.field-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.field .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lv{font-family:var(--f-disp);font-size:13px;color:var(--muted)}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.mini{position:relative}
.mini.off{opacity:.3}
.mini i{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-disp);font-size:9px;line-height:1;padding:1px 3px;border-radius:3px;background:var(--violet);color:var(--bg)}
.boss{border-color:color-mix(in srgb,var(--danger) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--danger) 12%,var(--panel2)),var(--panel) 120px)}
.rival{border-color:color-mix(in srgb,var(--info) 50%,var(--line))}
.avatar{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-size:22px;background:var(--info);color:var(--bg);box-shadow:inset 0 -4px 0 #0003}
.cuprow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.cuprow .stack{flex:1;min-width:0}
.cuprow.won{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.rankbadge{width:32px;height:32px;flex:none;border-radius:6px;display:grid;place-items:center;font-family:var(--f-disp);font-size:16px;background:var(--line);color:var(--ink)}
.cuprow.won .rankbadge{background:var(--accent);color:var(--accent-ink)}
.req{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--bg2);border-left:3px solid var(--accent);flex-wrap:wrap}
.req.done{border-left-color:var(--good);opacity:.6}
.req-body{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.req .from{font-family:var(--f-disp);font-size:13px;color:var(--accent)}

/* 一覧行 */
.mrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;min-width:0;transition:border-color .15s,transform .1s}
.mrow:hover:not(:disabled){border-color:var(--line2);transform:translateX(2px)}
.mrow.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel2))}
.mrow:disabled{opacity:.4;cursor:not-allowed}
.mrow .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .nm{font-family:var(--f-disp);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sub{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--good);transition:width .35s ease-out}
.bar.mid i{background:var(--accent)} .bar.low i{background:var(--danger)} .bar.mp i{background:var(--info)} .bar.xp i{background:var(--violet)}

/* なかま */
.party-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
.dhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.statgrid{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;align-items:center}
.radar{width:100%;height:auto}
.radar .rg{fill:none;stroke:var(--line2);stroke-width:1}
.radar .rv{fill:color-mix(in srgb,var(--accent) 35%,transparent);stroke:var(--accent);stroke-width:1.5}
.radar .rl{fill:var(--muted);font-size:9.5px;font-family:var(--f-disp)}
.gt-SS{fill:#ff8ad8} .gt-S{fill:var(--accent)} .gt-A{fill:var(--good)} .gt-B{fill:var(--info)} .gt-C{fill:var(--ink)} .gt-D{fill:var(--faint)}
.stats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stats td{padding:4px 0;border-bottom:1px solid var(--line)}
.stats td:first-child{color:var(--muted);width:6em}
.stats td.v{text-align:right;width:4em;font-family:var(--f-disp)}
.stats td.g{text-align:center;width:3em;font-family:var(--f-disp)}
.g-SS{color:#ff8ad8;text-shadow:0 0 6px #ff8ad888} .g-S{color:var(--accent)} .g-A{color:var(--good)} .g-B{color:var(--info)} .g-C{color:var(--ink)} .g-D{color:var(--faint)}
.sklist{display:flex;flex-direction:column;gap:6px}
.sk{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:6px;background:var(--bg2)}
.sk.up{box-shadow:inset 3px 0 0 var(--accent)}
.sk b{font-family:var(--f-disp);font-weight:400;white-space:nowrap}
.sk span{font-size:12px;color:var(--muted);text-align:right}
.lineage{font-size:13px;color:var(--muted)}
.rename input{background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font-family:var(--f-disp);font-size:18px;width:11em;max-width:100%}
.treewrap{overflow-x:auto}
.tree{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:4px 8px;min-width:460px}
.tree .th{font-family:var(--f-disp);font-size:12px;color:var(--muted)}
.tn{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;background:var(--bg2);font-size:12px;border-left:3px solid var(--fam,var(--line));align-self:center;min-width:0}
.tn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn.none{color:var(--faint)}

/* 配合 */
.breed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:10px;border:1px dashed var(--line2);background:var(--bg2);cursor:pointer;min-height:160px;justify-content:center;text-align:center}
.slot.on{border:1px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.slot .nm{font-family:var(--f-disp)}
.times{font-family:var(--f-disp);font-size:24px;color:var(--accent)}
.pr-main{display:flex;gap:16px;align-items:center}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.ichip{padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;font-size:13px}
.ichip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ichip.both:not(.on){border-color:var(--info);color:var(--info)}
.ichip:disabled{opacity:.35;cursor:not-allowed}
.rules{font-size:14px}
.rules summary{cursor:pointer;font-family:var(--f-disp)}
.rules ul{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;max-width:70ch}
.rumors{display:flex;flex-direction:column;gap:8px}
.rumor{padding:10px 12px;border-left:3px solid var(--line2);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
.rumor.done{border-left-color:var(--good)}
.rumor .f{font-family:var(--f-disp);color:var(--good);display:block;margin-top:4px}

/* 図鑑 */
.progress{height:10px;border-radius:5px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 80%,#000) 8px 10px)}
.famprog{display:flex;flex-wrap:wrap;gap:6px}
.fp{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--fam) 60%,transparent);color:var(--fam)}
.fp b{font-family:var(--f-disp);font-weight:400}
.fp.full{background:color-mix(in srgb,var(--fam) 20%,transparent)}
.mslist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ms{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:6px;background:var(--bg2)}
.ms .small{flex:1}
.ms.ok{box-shadow:inset 3px 0 0 var(--accent)}
.dexgroup h4{color:var(--fam);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dexgroup h4::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--fam) 40%,transparent)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}

.bc .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}

.pop.dmg{color:#fff} .pop.heal{color:var(--good)} .pop.miss{color:var(--muted);font-size:16px} .pop.st{color:var(--violet);font-size:14px}
@keyframes pop{0%{transform:translate(-50%,6px) scale(.6);opacity:0}25%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-26px) scale(1);opacity:0}}
.chips{display:flex;gap:4px;flex-wrap:wrap;min-height:4px;justify-content:inherit}

.chip{font-size:11px;line-height:1.4;padding:0 6px;border-radius:999px;border:1px solid currentColor;color:var(--accent)}
.chip.bad{color:var(--danger)} .chip.up{color:var(--good)}

.cmd{display:flex;flex-direction:column;gap:10px}
.typing{font-family:var(--f-disp);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.cmdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.skbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;text-align:left;border-left-width:4px}
.skbtn:hover:not(:disabled){border-color:var(--accent)}

.el-氷{border-left-color:#bfe8ff} .el-炎{border-left-color:#f2803a} .el-水{border-left-color:#4a9ae8} .el-雷{border-left-color:#f2e04a} .el-風{border-left-color:#8ad8a8} .el-光{border-left-color:#fff2a0}

/* 会話 */
.dlg-wrap{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 80%,transparent) 40%)}

@keyframes fuseR{0%{transform:translateX(130px);opacity:0}15%{opacity:1}80%{transform:translateX(8px);opacity:1}100%{transform:scale(.4);opacity:0}}
.burst{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#fff,var(--accent) 60%,transparent 70%);opacity:0;animation:burst .7s .9s ease-out both}

/* ランクのオーラ: Aは光る縁、Sは金の輪が回り、SSは虹の輪と脈打つ光 */
.seal.r-A{box-shadow:inset 0 0 0 2px var(--fam),inset 0 0 0 5px var(--bg2),inset 0 0 0 6px color-mix(in srgb,var(--fam) 50%,transparent),0 0 12px -3px var(--fam)}
.seal.r-S::before,.seal.r-SS::before{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));animation:spin 5s linear infinite}
.seal.r-S::before{background:conic-gradient(#f2b13c,#fff3c4 12%,transparent 25%,#f2b13c 50%,#fff3c4 62%,transparent 75%,#f2b13c)}
.seal.r-SS::before{inset:-6px;background:conic-gradient(#ff7ab8,#ffd36a,#7af2c8,#7ab8ff,#c89aff,#ff7ab8);animation-duration:3s}
.seal.xs.r-S::before,.seal.xs.r-SS::before{inset:-3px;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px))}
.seal.r-S img.spr{filter:drop-shadow(0 2px 0 #0009) drop-shadow(0 0 5px #f2b13c88)}
.seal.r-SS img.spr{animation:ssglow 2.4s ease-in-out infinite}
.seal.r-S img.spr.shiny{filter:hue-rotate(150deg) saturate(1.5) drop-shadow(0 0 5px #f2b13c88)}
.seal.r-SS img.spr.shiny{animation:none;filter:hue-rotate(150deg) saturate(1.5) drop-shadow(0 0 7px #ff9ad8)}
.seal.r-SS{box-shadow:inset 0 0 0 2px var(--fam),inset 0 0 0 5px var(--bg2),0 0 22px -4px #ff9ad8}
.seal.r-S .rk{background:linear-gradient(#ffe08a,#e89a2a);color:#2a1800}
.seal.r-SS .rk{background:linear-gradient(90deg,#ff7ab8,#ffd36a,#7af2c8,#7ab8ff);color:#1a0820}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes ssglow{0%,100%{filter:drop-shadow(0 2px 0 #0009) drop-shadow(0 0 4px #ff9ad877)}50%{filter:drop-shadow(0 2px 0 #0009) drop-shadow(0 0 10px #ffd36acc)}}

/* パーツごとにアニメ塗り風の影(右下)とハイライト(左上)を入れる */
const mixc=(a,b,t)=>{const A=parseInt(a.slice(1),16),Bc=parseInt(b.slice(1),16);const ch=s=>Math.round(((A>>s)&255)*(1-t)+((Bc>>s)&255)*t);return '#'+((1<<24)|(ch(16)<<16)|(ch(8)<<8)|ch(0)).toString(16).slice(1);};
function painter(x,o={}){
  const f=c=>{x.fillStyle=c;};const BD=o.band||1.7,CL=o.clip||1.1,MN=o.min||1;
  const fillS=(make,c,big,bb)=>{
    make(0,0);
    if(!big||!bb||!/^#[0-9a-f]{6}$/i.test(c)){f(c);x.fill();return;}
    const w=bb[2]-bb[0],h=bb[3]-bb[1],lx=bb[0]+w*.3,ly=bb[1]+h*.24,R=Math.hypot(w,h)*.92;
    const gr=x.createRadialGradient&&x.createRadialGradient(lx,ly,0,lx,ly,R);
    if(!gr||!gr.addColorStop){f(c);x.fill();return;}
    gr.addColorStop(0,mixc(c,'#fff8ea',.4));gr.addColorStop(.32,c);gr.addColorStop(.72,mixc(c,'#20183a',.3));gr.addColorStop(1,mixc(c,'#0c0a1c',.55));
    x.fillStyle=gr;x.fill();
  };
  return {
    e(cx,cy,rx,ry,c,rot=0){const m=Math.max(rx,ry);fillS((dx,dy)=>{x.beginPath();x.ellipse(cx+dx,cy+dy,rx,ry,rot,0,Math.PI*2);},c,Math.min(rx,ry)>=2.5*MN,[cx-m,cy-m,cx+m,cy+m]);},
    h(cx,cy,rx,ry,c){fillS((dx,dy)=>{x.beginPath();x.ellipse(cx+dx,cy+dy,rx,ry,0,Math.PI,Math.PI*2);x.closePath();},c,Math.min(rx,ry)>=3*MN,[cx-rx,cy-ry,cx+rx,cy]);},
    r(a,b,w,h,c){f(c);x.fillRect(a,b,w,h);},
    p(pts,c){const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);const big=Math.max(...xs)-Math.min(...xs)>=5*MN&&Math.max(...ys)-Math.min(...ys)>=5*MN;
      fillS((dx,dy)=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a+dx,b+dy):x.moveTo(a+dx,b+dy));x.closePath();},c,big,[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]);},
    l(a,b,c2,d,c,w=1){x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.strokeStyle=c;x.lineWidth=w;x.lineCap='round';x.stroke();},
    path(pts,c,w=1){x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.strokeStyle=c;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.stroke();},
    eye(a,b){f('#101018');x.fillRect(a,b,2,2);f('#ffffff');x.fillRect(a,b,1,1);},
  };
}

function sprite(id,sil){
  const k=id+(sil?'_s':'');
  if(SPRC[k])return SPRC[k];
  const N=96,cv=document.createElement('canvas');cv.width=cv.height=N;
  const ctx=cv.getContext('2d');
  try{if(DRAW96[id])DRAW96[id](painter(ctx,{band:2.4,clip:1.4,min:1.8}));else{ctx.save();ctx.scale(2,2);DRAW[id](painter(ctx));ctx.restore();}}catch(e){}
  const im=ctx.getImageData(0,0,N,N),d=im.data,solid=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++){if(d[i*4+3]>=110){solid[i]=1;d[i*4+3]=255;}else d[i*4+3]=0;}
  if(!sil){
    let seed=0;for(const ch of id)seed=(seed*31+ch.charCodeAt(0))|0;
    const hs=(a,b)=>{let h=(a*374761393+b*668265263+seed)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;};
    const S=(x,y)=>x>=0&&x<N&&y>=0&&y<N&&solid[y*N+x];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const i=y*N+x;if(!solid[i])continue;
      let f=(hs(x,y)-.5)*.1+(hs(x,y>>2)-.5)*.08;
      if(!S(x,y-1))f+=.16;else if(!S(x,y-2))f+=.06;
      if(!S(x,y+1))f-=.2;else if(!S(x,y+2))f-=.09;
      if(!S(x+1,y))f-=.05;
      for(let c=0;c<3;c++){const v=d[i*4+c];d[i*4+c]=f>0?v+(255-v)*f:v*(1+f);}
    }
  }
  const OUT=sil?[110,122,150]:[10,13,24],FILL=[38,46,66];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=y*N+x;
    if(solid[i]){if(sil){d[i*4]=FILL[0];d[i*4+1]=FILL[1];d[i*4+2]=FILL[2];}continue;}
    const nb=(y<N-1&&solid[i+N])?i+N:(y>0&&solid[i-N])?i-N:(x>0&&solid[i-1])?i-1:(x<N-1&&solid[i+1])?i+1:-1;
    if(nb>=0){for(let c=0;c<3;c++)d[i*4+c]=sil?OUT[c]:Math.round(d[nb*4+c]*.42+OUT[c]*.58);d[i*4+3]=255;}
  }
  ctx.putImageData(im,0,0);
  return SPRC[k]=cv.toDataURL();
}

  return seg;
}

const GACHA={c1:100,c10:1000,rate:[[8,.03],[7,.15],[6,.82]],pity:100};

function dayKey(off=0){const d=new Date(Date.now()+off*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekPickup(){const w=Math.floor((Date.now()/864e5+3)/7),ps=gachaPool(8);const end=new Date((w*7-3+7)*864e5);return {sp:ps[w%ps.length].id,end};}
function addStars(n,why){state.stars=(state.stars||0)+n;if(why)ui.starNote=`★${n} ${why}`;}
function firstOwn(id){if(!state.owned[id]&&SP[id]&&!SP[id].gacha)addStars(10,'はじめてなかまにした種族');}
function dailyRoll(){const t=dayKey();if(!state.daily||state.daily.d!==t)state.daily={d:t,ex:0,win:0,br:0,got:{}};}
function dailyInc(k){if(!state||!state.started)return;dailyRoll();state.daily[k]=(state.daily[k]||0)+1;}
const MISSIONS=[{k:'ex',n:'探索する',goal:10,rw:50},{k:'win',n:'戦闘で勝つ',goal:5,rw:50},{k:'br',n:'配合する',goal:1,rw:50},{k:'all',n:'上の3つをすべて受け取る',goal:3,rw:100}];
const missionVal=k=>k==='all'?['ex','win','br'].filter(x=>state.daily.got[x]).length:(state.daily[k]||0);
const missionReady=()=>{dailyRoll();return MISSIONS.filter(x=>!state.daily.got[x.k]&&missionVal(x.k)>=x.goal).length;};
function loginBonus(){
  if(!state.started)return null;
  const t=dayKey(),y=dayKey(-1),L=state.login||{last:'',streak:0};
  if(L.last===t)return null;
  const streak=L.last===y?L.streak+1:1;state.login={last:t,streak};
  const g=100+(streak%7===0?500:0);addStars(g);dailyRoll();save();
  return {g,streak};
}
function loginCheck(){const r=loginBonus();if(r&&!B){ui.toast=`ログインボーナス ★${r.g}(${r.streak}日連続${r.streak%7===0?' ・ 7日ごとのボーナス！':''})`;render();}}
function gachaRetro(){
  if(state.flags.gacha||!state.started)return;
  state.flags.gacha=true;
  const own=dexList().filter(s=>state.owned[s.id]).length,boss=Object.keys(state.boss).length,cups=Object.keys(state.cups).length,req=Object.keys(state.reqDone).length,dm=Object.keys(state.dexClaim).length;
  const g=1000+own*10+boss*300+cups*200+req*30+dm*100;

}
function rollRank(guar){
  state.gpity=(state.gpity||0)+1;
  if(state.gpity>=GACHA.pity){state.gpity=0;return {r:8,pity:true};}
  const x=Math.random();let acc=0,r=6;for(const [rk,p] of GACHA.rate){acc+=p;if(x<acc){r=rk;break;}}
  if(guar&&r<7)r=7;if(r===8)state.gpity=0;return {r};
}
function gachaPull(n){
  const cost=n===10?GACHA.c10:GACHA.c1;if((state.stars||0)<cost)return;
  state.stars-=cost;const pu=weekPickup().sp,out=[];
  for(let i=0;i<n;i++){
    const {r,pity}=rollRank(n===10&&i===9&&!out.some(o=>o.r>=7));
    let sp;if(r===8&&(pity||Math.random()<.5))sp=pu;else sp=pick(gachaPool(r)).id;
    const tl={6:[6,13],7:[9,15],8:[12,17]}[r];
    const isNew=!state.owned[sp];
    const m=newMon(sp,10,{talent:randTalent(tl[0],tl[1])});m.gen=0;
    if(Math.random()<1/40){m.shiny=true;STATS.forEach(k=>m.talent[k]=Math.min(17,m.talent[k]+1));}
    addMon(m);out.push({uid:m.uid,r,isNew});
  }
  const mx=Math.max(...out.map(o=>o.r));
  ui.gacha={list:out,mx,n};state.gpulls=(state.gpulls||0)+n;save();sfx(mx>=8?'shiny':'breed');render();
}

const towerOpen=()=>!!state.boss.tengu;
const towerLv=n=>30+n*4;
function towerFoes(n){
  const boss=n%5===0,lv=towerLv(n),plus=Math.floor(n/3);
  const rlo=Math.min(6,3+Math.floor(n/6)),rhi=Math.min(7,4+Math.floor(n/5));
  const norm=dexList().filter(s=>s.rank>=rlo&&s.rank<=rhi&&s.fam!=='metal');
  const gr=n<10?[6]:n<20?[6,7]:n<30?[7,8]:[8,9];
  const gp=SPL.filter(s=>s.gacha&&gr.includes(s.rank));
  const gch=Math.min(.6,.1+n*.02);
  const one=()=>[Math.random()<gch?pick(gp).id:pick(norm).id,lv+ri(-1,1),plus];
  const foes=[one(),one(),one()];
  if(boss){const top=Math.max(...gr),bp=SPL.filter(s=>s.gacha&&s.rank===top);foes[1]=[pick(bp).id,lv+2,plus+2];}
  return foes;
}
function startTower(n){
  if(!towerOpen()||n>(state.tower||0)+1||n<1)return;
  startBattle(towerFoes(n),{tower:n,towerBoss:n%5===0,trainer:'星界の番人',field:`星界の塔 ${n}階${n%5===0?' ・ 番人の間':''}`,scene:'tower'});
}
function towerReward(n){return {stars:n%5===0?200:30,kakusei:n%10===0?1:0,tenpu:n%10===0?1:0};}

const b64e=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
const b64d=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function packState(o){
  const json=JSON.stringify(o);
  try{if(window.CompressionStream){const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return {z:b64e(buf)};}}catch(e){}
  return {s:json};
}
async function unpackState(d){
  if(!d)return null;
  let json=d.s;
  if(d.z)json=await new Response(new Blob([b64d(d.z)]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const o=JSON.parse(json);
  return o&&o.v===1&&Array.isArray(o.party)?o:null;
}

async function cloudWrite(key,extra){

async function cloudPush(){
  clearTimeout(CLOUD.timer);
  if(!CLOUD.db||!state.started||['readonly','full'].includes(CLOUD.status))return;
  if(CLOUD.busy){CLOUD.dirty=true;return;}
  CLOUD.busy=true;CLOUD.status='saving';cloudPaint();
  try{
    try{await cloudWrite('main');}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*1200));await cloudWrite('main');}else throw e;}
    CLOUD.at=Date.now();CLOUD.status='ok';
  }catch(e){
    const c=e&&e.code;CLOUD.status=c==='invalid_argument'?'readonly':c==='quota_exceeded'?'full':c==='revoked'||c==='not_granted'?'off':'error';
    if(CLOUD.status==='error'){clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,30000);}
  }
  CLOUD.busy=false;cloudPaint();
  if(CLOUD.dirty){CLOUD.dirty=false;cloudSchedule();}
}

    CLOUD.db=db;CLOUD.uid=uid;

  }catch(e){CLOUD.status=e&&e.code==='timeout'?'error':'off';cloudPaint();}
}

function calc(m){
  const sp=SP[m.sp],nat=NAT[m.nature].m,r={};
  STATS.forEach((k,i)=>{
    const v=sp.base[i]*(m.lv+4)/5*(1+m.talent[k]/100)*(1+m.plus*.03)*(nat[k]||1)+(m.bonus[k]||0);
    r[k]=clamp(Math.floor(v),1,sp.gacha?99999:999);
  });
  return r;
}
const needExp=m=>Math.floor((6*Math.pow(m.lv,1.8)+10)*(1+SP[m.sp].rank*.12));
const capLv=m=>capFor(m.sp,m.plus);
const mName=m=>(m.nick||SP[m.sp].name)+(m.plus?'+'+m.plus:'');
function learn(m){
  const got=[];
  for(const [lv,id] of SP[m.sp].skills){if(lv<=m.lv&&!m.skills.includes(id)&&m.skills.length<10){m.skills.push(id);got.push(id);}}
  return got;
}
function newMon(spId,lv,o={}){
  const sp=SP[spId];
  const m={uid:o.temp?tempUid--:state.uidN++,sp:spId,lv,exp:0,plus:o.plus||0,nature:o.nature||pick(Object.keys(NAT)),
    talent:o.talent||randTalent(0,10),bonus:o.bonus||zero(),skills:[],traits:o.traits||[sp.trait],parents:o.parents||null};
  learn(m);
  if(o.skills)for(const s of o.skills)if(!m.skills.includes(s)&&m.skills.length<10)m.skills.push(s);
  const st=calc(m);m.hp=st.hp;m.mp=st.mp;
  return m;
}
function gainExp(m,x,lines){
  if(m.lv>=capLv(m)){m.exp=0;return;}
  m.exp+=x;
  while(m.lv<capLv(m)&&m.exp>=needExp(m)){
    m.exp-=needExp(m);
    const b=calc(m);m.lv++;const a=calc(m);
    m.hp=Math.min(a.hp,m.hp+(a.hp-b.hp));m.mp=Math.min(a.mp,m.mp+(a.mp-b.mp));
    lines.push(`${mName(m)}はレベル${m.lv}に上がった！`);
    for(const id of learn(m))lines.push(`${mName(m)}は「${SK[id].n}」を覚えた！`);
  }
  if(m.lv>=capLv(m)){m.exp=0;lines.push(`${mName(m)}はレベル上限に達した。配合で+値を上げよう`);}
}

/* ========== 描画パーツ ========== */
function seal(spId,size='',known=true,shiny=false){
  const sp=SP[spId];
  if(!known)return `<div class="seal ${size}" aria-label="未発見"><span>？</span></div>`;
  const sil=known==='sil',sh=shiny&&!sil;
  return `<div class="seal ${size} ${sh?'sh':''} ${sp.fam==='metal'&&!sil?'metal':''} ${sp.fam==='myst'&&!sil?'myst':''} ${!sil&&sp.rank>=5?'r-'+RANKS[sp.rank]:''}" style="--fam:${sil?'var(--faint)':FAM[sp.fam].c}" aria-hidden="true">${!sil&&ART[spId]&&size!=='xs'?`<img class="art ${sh?'shiny':''}" src="${ART[spId]}" alt="">`:`<img class="spr ${sh?'shiny':''}" src="${sprite(spId,sil)}" alt="">`}${sil?'':`<b class="rk">${RANKS[sp.rank]}</b>`}${!sil&&(size==='lg'||size==='xl')?`<i class="gl">${sp.glyph}</i>`:''}</div>`;
}
function hpBar(v,max,cls=''){
  const r=max?v/max:0;const c=cls||(r<.25?'low':r<.5?'mid':'');
  return `<div class="bar ${c}"><i style="width:${clamp(r*100,0,100)}%"></i></div>`;
}
function mrow(m,on,act='sel',dis=false,extra=''){
  const st=calc(m),sp=SP[m.sp];
  return `<button class="mrow ${on?'on':''}" data-act="${act}" data-uid="${m.uid}" ${dis?'disabled':''}>${seal(m.sp,'sm',true,m.shiny)}
    <div class="info"><span class="nm">${esc(mName(m))}</span><span class="sub num">Lv${m.lv} ・ ${FAM[sp.fam].n} ・ HP ${m.hp}/${st.hp}${m.gen?' ・ 第'+m.gen+'世代':''}${(state.daycare||[]).includes(m.uid)?' ・ 育て屋':''}${extra}</span>${hpBar(m.hp,st.hp)}</div></button>`;
}

/* ========== 画面 ========== */
const app=document.getElementById('app');
function render(){
  let body;
  if(!state.started)body=renderIntro()+(ui.transfer?renderTransfer():'');
  else if(B)body=renderBattle();
  else body=`${renderHeader()}${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:''}${renderTab()}${renderFoot()}${ui.transfer?renderTransfer():''}`;
  app.innerHTML=`<div class="wrap">${body}</div>${!B&&ui.result?renderResult():''}${!B&&ui.gacha?renderGachaResult():''}${ui.dlg?renderDlg():''}`;
  bgmUpdate();
}
/* 会話ウィンドウ */
function talk(lines,cb){ui.dlg={lines,i:0,cb};render();}
function renderDlg(){
  const d=ui.dlg,[who,text]=d.lines[d.i],last=d.i>=d.lines.length-1;
  return `<div class="dlg-wrap" role="dialog" aria-label="会話"><button class="dlg win" data-act="dlgNext" autofocus>${who?`<span class="who">${esc(who)}</span>`:''}<p>${esc(text)}</p><span class="more">${last?'とじる':'▼'}</span></button></div>`;
}
function renderIntro(){
  const st=['ibote','happadanuki','yamoryu'];
  return `<section class="intro">
    <div class="hero"><img class="scene" src="${scene('inaka',2)}" alt=""><div class="hero-title"><span class="eyebrow">ジェンガルア地方 ・ JG01 こもれび町</span><h1 class="logo">ジェンガルア配合録</h1></div></div>
    <p>この地方では、身近な生き物がときどき不思議な力に目覚める。人々はそれを「魔生物(ませいぶつ)」と呼び、ともに暮らしてきた。</p>
    <p class="muted">あなたは、こもれび町の配合研究所にやって来た新人ブリーダー。魔生物をスカウトし、育て、配合して、まだ誰も見たことのない魔生物を生み出そう。まずは最初の相棒を選んでほしい。</p>
    <div class="row"><button class="btn sm" data-act="bgm" aria-pressed="${!!state.bgm}">♪ BGM ${state.bgm?'オン':'オフ'}</button><button class="btn sm" data-act="sound" aria-pressed="${!!state.sound}">効果音 ${state.sound?'オン':'オフ'}</button></div>
    <div class="panel row between"><span class="small">別の端末やclaude.ai版で遊んだデータがある？ 引き継ぎコードかセーブファイルで続きから遊べる。</span><button class="btn primary" data-act="transfer">データを引き継ぐ</button></div>
    <div class="starters">${st.map(id=>{const s=SP[id];return `<div class="panel starter">${seal(id,'lg')}<h3>${s.name}</h3><span class="small muted">${FAM[s.fam].n} ・ モチーフ: ${s.motif}</span><p class="small">${s.desc}</p><button class="btn primary" data-act="starter" data-id="${id}">${s.name}にする</button></div>`;}).join('')}</div>
  </section>`;
}
function renderHeader(){
  const t=TOWN[state.town],tm=TIMES[state.time];
  const tabs=[['map','探索'],['party','なかま'],['breed','配合'],['gacha','ガチャ'],['tower','星界の塔'],['dex','図鑑'],['shop','コンビニ']];
  const dot=reqReadyCount();
  return `<header class="top"><div class="brand"><span class="eyebrow">ジェンガルア地方</span><span class="logo sm">ジェンガルア配合録</span></div>
    <div class="hud"><span class="tchip" style="--tc:${tm.c}"><i></i>${tm.n}</span><span class="loc">${t.code} ${t.name}</span><b class="yen num">${state.yen.toLocaleString()}<small>円</small></b><b class="stars num" title="流星石">★${(state.stars||0).toLocaleString()}</b><button class="btn sm ghost" data-act="bgm" aria-pressed="${!!state.bgm}" title="${state.bgm&&BGM.cur?'♪ '+(SONG_NAME[BGM.cur]||''):''}">BGM ${state.bgm?'オン':'オフ'}</button><button class="btn sm ghost" data-act="sound" aria-pressed="${!!state.sound}">効果音 ${state.sound?'オン':'オフ'}</button></div></header>
    <nav class="tabs" aria-label="メニュー">${tabs.map(([k,n])=>`<button class="tab" data-act="tab" data-v="${k}" ${ui.tab===k?'aria-current="page"':''}>${n}${k==='map'&&dot?`<i class="ndot" title="達成できる依頼があります">${dot}</i>`:''}${k==='gacha'&&missionReady()?`<i class="ndot" title="受け取れるミッションがあります">${missionReady()}</i>`:''}</button>`).join('')}</nav>${ui.tab!=='party'?renderPartyBar():''}`;
}

/* ----- データの引き継ぎ(別の端末へ) ----- */
function saveCode(){try{return 'JGR1:'+btoa(unescape(encodeURIComponent(JSON.stringify(state))));}catch(e){return '';}}
function readCode(s){
  s=(s||'').trim();
  if(s.startsWith('{')){let o;try{o=JSON.parse(s);}catch(e){throw new Error('ファイルの中身を読み取れませんでした。');}if(!o||o.v!==1||!Array.isArray(o.party)||!o.party.length)throw new Error('このファイルからはセーブデータを読み取れませんでした。');return o;}
  s=s.replace(/\s+/g,'');
  if(!s.startsWith('JGR1:'))throw new Error('「JGR1:」から始まる引き継ぎコードを貼りつけてください。');
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(s.slice(5)))));}catch(e){throw new Error('コードが途中で切れているか、まちがっています。最後までコピーできているか確かめてください。');}
  if(!o||o.v!==1||!Array.isArray(o.party)||!o.party.length)throw new Error('このコードからはセーブデータを読み取れませんでした。');
  return o;
}

function giveReward(rw){
  const out=[];
  if(rw.yen){state.yen+=rw.yen;out.push(rw.yen.toLocaleString()+'円');}
  for(const [k,n] of Object.entries(rw.items||{})){state.items[k]=(state.items[k]||0)+n;out.push(`${ITEMS[k].n}×${n}`);}
  return out.join('・');
}
const rewardText=rw=>[rw.yen?rw.yen.toLocaleString()+'円':'',...Object.entries(rw.items||{}).map(([k,n])=>`${ITEMS[k].n}×${n}`)].filter(Boolean).join('・');
function reqMatch(need){
  if(need.dex)return dexList().filter(s=>state.owned[s.id]).length>=need.dex?{dex:true}:null;
  return allMons().find(m=>(!need.sp||m.sp===need.sp)&&(!need.fam||SP[m.sp].fam===need.fam)&&(need.minRank==null||SP[m.sp].rank>=need.minRank)
    &&(!need.minPlus||m.plus>=need.minPlus)&&(!need.shiny||m.shiny)&&(!need.upgraded||m.traits.some(t=>TR[t].base))
    &&(!need.trait||m.traits.includes(need.trait))&&(!need.minLv||m.lv>=need.minLv)&&(!need.gen||(m.gen||0)>=need.gen)&&(!need.talentSS||STATS.some(k=>m.talent[k]>=18))&&(!need.lineage||m.lin))||null;
}
const reqReadyCount=()=>REQUESTS.filter(r=>!state.reqDone[r.id]&&townOpen(TOWN[r.town])&&reqMatch(r.need)).length;
const cupOpen=c=>townOpen(TOWN.kasumi)&&(!c.req||state.cups[c.req])&&(!c.reqBoss||state.boss[c.reqBoss]);

        <div class="tiles">${box.length?box.map(x=>tile(x,'sel',{on:x.uid===ui.sel})).join(''):'<p class="small muted">あずけている魔生物はいない。スカウトした魔生物は、パーティが3体いるとここに入る。</p>'}</div></div>

const careList=()=>(state.daycare||[]).filter(u=>{const m=findMon(u);return m&&state.box.includes(m);});
function sortedBox(){
  let b=state.box.slice();const s=ui.sort||'new',f=ui.boxFam||'all';
  if(f!=='all')b=b.filter(m=>SP[m.sp].fam===f);
  if(s==='new')return b.sort((x,y)=>y.uid-x.uid);
  if(s==='lv')return b.sort((x,y)=>y.lv-x.lv);
  if(s==='rank')return b.sort((x,y)=>SP[y.sp].rank-SP[x.sp].rank||y.lv-x.lv);
  return b.sort((x,y)=>FK.indexOf(SP[x.sp].fam)-FK.indexOf(SP[y.sp].fam)||SP[y.sp].rank-SP[x.sp].rank);
}

function treeHTML(m){
  if(!m.parents)return '<p class="lineage">野生で生まれた(親の記録なし)</p>';
  const box=(n,col,row,span)=>`<div class="tn ${n?'':'none'}" style="grid-column:${col};grid-row:${row} / span ${span};${n?`--fam:${FAM[SP[n.sp].fam].c}`:''}">${n?`${seal(n.sp,'xs',true,n.sh)}<span>${SP[n.sp].name}${n.plus?'+'+n.plus:''}</span>`:'<span>野生</span>'}</div>`;
  let h='<div class="th" style="grid-column:1;grid-row:1">親</div><div class="th" style="grid-column:2;grid-row:1">祖父母</div><div class="th" style="grid-column:3;grid-row:1">曽祖父母</div>';
  for(let i=0;i<2;i++){
    const g1=m.parents[i]||null;h+=box(g1,1,2+i*4,4);
    for(let j=0;j<2;j++){
      const g2=g1&&g1.p?g1.p[j]:null;h+=box(g2,2,2+i*4+j*2,2);
      for(let k=0;k<2;k++){const g3=g2&&g2.p?g2.p[k]:null;h+=box(g3,3,2+i*4+j*2+k,1);}
    }
  }
  return `<div class="treewrap"><div class="tree">${h}</div></div>`;
}
function radar(m){
  const cx=70,cy=64,R=48;
  const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  const poly=f=>STATS.map((k,i)=>pt(i,R*f(k)).map(v=>v.toFixed(1)).join(',')).join(' ');

function m1(spec,m){if(typeof spec==='string')return m.sp===spec;return SP[m.sp].fam===spec.fam&&SP[m.sp].rank>=(spec.minRank||0);}
function condOK(r,a,b){
  if(r.plusSum&&a.plus+b.plus<r.plusSum)return false;
  if(r.aParent&&!(a.parents||[]).some(p=>p.sp===r.aParent))return false;
  if(r.aShiny&&!a.shiny)return false;
  if(r.aTrait&&!a.traits.includes(r.aTrait))return false;
  if(r.aGen&&(a.gen||0)<r.aGen)return false;
  return true;
}
function condText(r){
  if(r.plusSum)return `+値の合計${r.plusSum}以上が必要`;
  if(r.aParent)return '血統(親)の条件が足りない';
  if(r.aShiny)return '色違いである必要がある';
  if(r.aTrait)return `特性「${TR[r.aTrait].n}」が必要`;
  if(r.aGen)return `第${r.aGen}世代以上が必要`;
  return '条件が足りない';
}
function pickByRank(fam,tr){
  const c=SPL.filter(s=>s.fam===fam&&!s.special);
  c.sort((x,y)=>Math.abs(x.rank-tr)-Math.abs(y.rank-tr)||y.rank-x.rank);
  return c[0].id;
}
function predict(a,b){
  let near=null;
  for(const r of RECIPES){
    for(const [x,y] of [[a,b],[b,a]]){
      if(m1(r.a,x)&&m1(r.b,y)){if(condOK(r,x,y))return {sp:r.out,special:true,r};near=r;}
    }
  }
  const fa=SP[a.sp].fam,fb=SP[b.sp].fam;
  /* 血統配合: Bランク以上が1体目(左)で、2体目が同じ系統なら、1体目と同じ種族が生まれる */
  if(fa===fb&&SP[a.sp].rank>=LINEAGE_RANK)return {sp:a.sp,special:false,lineage:true,fam:fa,near};
  const fam=MIX[fa+'|'+fb];
  const tr=Math.min(4,Math.round((SP[a.sp].rank+SP[b.sp].rank)/2+.5));
  return {sp:pickByRank(fam,tr),special:false,fam,near};
}

const swapLineage=(a,b,pr)=>!pr.special&&!pr.lineage&&SP[a.sp].fam===SP[b.sp].fam&&SP[b.sp].rank>=LINEAGE_RANK;

/* 親2体の特性から、受け継げる特性の候補を作る。両親がそろって持つ特性は上位化する */
function traitPool(a,b,native){
  const map=new Map();
  for(const m of [a,b])for(const t of m.traits){
    if(TR[t].noInherit)continue;
    const bs=baseOf(t);const e=map.get(bs)||{who:new Set(),lv:0};
    e.who.add(m.uid);e.lv=Math.max(e.lv,TR[t].base?2:1);map.set(bs,e);
  }
  const out=[];
  for(const [bs,e] of map){
    const upg=(e.lv===2||e.who.size>1)&&TR[bs].up;
    const id=upg?TR[bs].up:bs;
    if(id===native)continue;
    out.push({id,fresh:!!upg&&e.lv<2});

}

function doBreed(){
  const a=findMon(ui.bA),b=findMon(ui.bB);if(!a||!b)return;
  const cat=(ui.cats||[]).filter(k=>(state.items[k]||0)>0).slice(0,CATMAX);
  const pr=predict(a,b);let out=pr.sp;const notes=[];
  if(pr.special)notes.push('特殊配合');
  else if(pr.lineage)notes.push('血統配合');
  else{
    const grands=[...(a.parents||[]),...(b.parents||[])].map(p=>p.sp);
    if(grands.length&&Math.random()<(cat.includes('omamori')?.4:.08)){out=pick(grands);notes.push('隔世遺伝');}
    else if(Math.random()<(cat.includes('tsuki')?.3:.05)){const up=SPL.filter(s=>s.fam===SP[out].fam&&!s.special&&s.rank===SP[out].rank+1);if(up.length){out=pick(up).id;notes.push('突然変異');}}
  }
  const plus=kidPlus(a,b,pr,cat),extra=cat.includes('makimono')?1:0;
  const pure=SP[a.sp].fam===SP[b.sp].fam;
  const shiny=Math.random()<shinyP(a,b,cat);
  const talent={};
  STATS.forEach(k=>{
    const ta=a.talent[k],tb=b.talent[k];
    let v=cat.includes('tane')?Math.max(ta,tb)+ri(0,3):(Math.random()<.5?ta:tb)+ri(-2,3);
    v+=(pure?1:0)+(shiny?1:0);talent[k]=clamp(v,0,Math.max(15,ta,tb));
  });
  const r=Math.random();const nature=r<.4?a.nature:r<.8?b.nature:pick(Object.keys(NAT));
  const sa=calc(a),sb=calc(b);const bonus={};STATS.forEach(k=>bonus[k]=Math.floor((sa[k]+sb[k])/8));
  const res=resolveInh(ui.inh.slice(0,skillSlots(plus)+extra),inhPool(a,b));
  const traits=finalTraits(SP[out].trait,ui.trs.filter(t=>baseOf(t)!==SP[out].trait||TR[t].base).slice(0,traitSlots(plus)+extra));
  const parents=[nodeOf(a),nodeOf(b)];
  const gen=Math.max(a.gen||0,b.gen||0)+1;
  cat.forEach(k=>state.items[k]--);
  if(shiny)notes.push('✦色違い');
  if(pure)notes.push('純血');
  const wasInParty=state.party.includes(a)||state.party.includes(b);
  removeMon(a);removeMon(b);
  const child=newMon(out,1,{plus,talent,nature,bonus,skills:res.list,traits,parents});
  child.shiny=shiny;child.gen=gen;if(pr.lineage)child.lin=true;
  if(wasInParty&&state.party.length<3)state.party.push(child);else if(!state.party.length)state.party.push(child);else state.box.push(child);
  firstOwn(out);dailyInc('br');state.owned[out]=true;state.seen[out]=true;state.breeds++;
  ui.result={uid:child.uid,note:notes.join(' ・ '),fused:res.fused,upT:traits.filter(t=>TR[t].base),pa:a.sp,pb:b.sp};if(shiny)state.shinySeen[out]=true;sfx(shiny?'shiny':'breed');
  ui.bA=ui.bB=null;ui.bSlot='A';ui.inh=[];ui.trs=[];ui.cats=[];ui.btab='pick';
  save();render();
}

/* ========== バトル ========== */
const alive=c=>c.hp>0&&!c.gone;
/* 特性の段階: 0=なし 1=通常 2=上位 */
const tl=(c,t)=>{let v=0;for(const x of c.mon.traits){if(x===t)v=Math.max(v,1);else if(TR[x]&&TR[x].base===t)v=2;}return v;};
const has=(c,t)=>tl(c,t)>0;
const foesOf=c=>c.side==='ally'?B.enemies:B.allies;
const matesOf=c=>c.side==='ally'?B.allies:B.enemies;
const atkV=c=>c.st.atk*(1+.25*c.stg.atk);
const defV=c=>c.st.def*(1+.25*c.stg.def);
const agiV=c=>c.st.agi*[1,1.2,1.4][tl(c,'subashikoi')]*(c.sts.para?.5:1);
function log(s){B.log.push(s);if(B.log.length>60)B.log.shift();}
function comb(m,side){const st=calc(m);return {mon:m,side,st,hp:side==='ally'?m.hp:st.hp,mp:side==='ally'?m.mp:st.mp,stg:{atk:0,def:0},sts:{},evade:0,shib:false,label:mName(m)};}
function pickT(list,idx){if(list[idx]&&alive(list[idx]))return list[idx];const a=list.filter(alive);return a.length?pick(a):null;}
function lowest(list){return list.filter(alive).sort((x,y)=>x.hp/x.st.hp-y.hp/y.st.hp)[0];}

function startBattle(foes,opt){
  const allies=state.party.filter(m=>m.hp>0).map(m=>comb(m,'ally'));
  if(!allies.length){ui.toast='戦えるなかまがいない。銭湯で回復しよう';render();return;}
  const trainer=!!(opt.cup||opt.rival||opt.tower);
  const enemies=foes.map(([sp,lv,plus])=>{
    const m=newMon(sp,lv,{temp:true,plus:plus||0,talent:opt.boss?randTalent(8,14):trainer?randTalent(6,12):randTalent(0,10)});
    if(!opt.boss&&!trainer&&Math.random()<1/150){m.shiny=true;STATS.forEach(k=>m.talent[k]=Math.min(15,m.talent[k]+1));}
    const c=comb(m,'enemy');
    if(opt.tower){const k=1+opt.tower*.02;c.st.hp=Math.floor(c.st.hp*k);c.hp=c.st.hp;}
    if(opt.boss){c.st.hp=Math.floor(c.st.hp*(opt.ura?2.4:1.6));c.st.atk=Math.floor(c.st.atk*(opt.ura?1.05:.9));c.hp=c.st.hp;c.boss=true;}
    return c;
  });
  const cnt={};enemies.forEach(c=>cnt[c.label]=(cnt[c.label]||0)+1);
  const idx={};enemies.forEach(c=>{if(cnt[c.label]>1){idx[c.label]=(idx[c.label]||0)+1;c.label+='ABC'[idx[c.label]-1];}});
  enemies.forEach(c=>{state.seen[c.mon.sp]=true;if(c.mon.shiny)state.shinySeen[c.mon.sp]=true;});
  B={allies,enemies,turn:1,log:[],phase:'input',inputIdx:0,cmds:[],target:0,menu:'main',boss:!!opt.boss,ura:!!opt.ura,town:opt.town,field:opt.field,scene:opt.scene||'inaka',
    cup:opt.cup||null,rival:opt.rival||null,tower:opt.tower||0,towerBoss:!!opt.towerBoss,trainer:opt.trainer||null,onigiri:false,auto:false,result:null,fx:null,pops:[],intro:true,next:null,after:null};
  log(opt.boss?`${(opt.ura?TOWN[opt.town].ura:TOWN[opt.town].boss).title}が立ちはだかる！`:opt.trainer?`${opt.trainer}が勝負をしかけてきた！`:`${[...new Set(enemies.map(c=>SP[c.mon.sp].name))].join('と')}があらわれた！`);
  if(enemies.some(c=>has(c,'metalbody')))log('キラリと光る魔生物がいる！');
  if(enemies.some(c=>c.mon.shiny)){enemies.filter(c=>c.mon.shiny).forEach(c=>log(`色違いの${c.label}がいる！`));sfx('shiny');}
  if(opt.towerBoss&&enemies[1]){const c=enemies[1];c.st.hp=Math.floor(c.st.hp*2);c.hp=c.st.hp;c.boss=true;c.label='番人 '+c.label;}
  for(const c of [...allies,...enemies]){
    if(has(c,'bakegaku'))c.evade=tl(c,'bakegaku')*2;
    if(has(c,'iatsu')){const hv=tl(c,'iatsu')===2;foesOf(c).forEach(f=>{f.stg.atk=Math.max(-2,f.stg.atk-1);if(hv)f.stg.def=Math.max(-2,f.stg.def-1);});log(`${c.label}の${hv?'覇王の威厳で、相手の攻撃と守備':'威圧感で、相手の攻撃'}が下がった！`);}
  }
  B.inputIdx=nextInput(-1);
  save();render();window.scrollTo(0,0);
}
function nextInput(from){for(let i=from+1;i<B.allies.length;i++)if(alive(B.allies[i]))return i;return -1;}
function setCmd(cmd){
  B.cmds[B.inputIdx]=cmd;B.menu='main';
  const n=nextInput(B.inputIdx);
  if(n<0)runTurn();else{B.inputIdx=n;render();}
}
function cmdBack(){for(let i=B.inputIdx-1;i>=0;i--)if(alive(B.allies[i])){B.inputIdx=i;B.cmds[i]=null;B.menu='main';render();return;}}
function autoTurn(){for(let i=0;i<B.allies.length;i++)if(alive(B.allies[i])&&(i>=B.inputIdx||!B.cmds[i]))B.cmds[i]=ai(B.allies[i]);runTurn();}

function ai(c){
  const foes=foesOf(c).filter(alive),mates=matesOf(c);
  const sks=c.mon.skills.map(id=>[id,SK[id]]).filter(([,s])=>s&&s.mp<=c.mp);
  const tgt=c.side==='ally'?B.target:B.allies.indexOf(pick(foes));
  const dead=mates.filter(x=>x.hp<=0&&!x.gone);
  if(dead.length){const r=sks.find(([,s])=>s.t==='revive');if(r&&Math.random()<.7)return {k:'sk',id:r[0],tgt};}
  const hurt=mates.filter(x=>alive(x)&&x.hp/x.st.hp<.45);
  if(hurt.length){const h=sks.filter(([,s])=>s.k==='heal'&&(s.t==='ally'||s.t==='allies'||(s.t==='self'&&hurt.includes(c))));if(h.length&&Math.random()<.75)return {k:'sk',id:pick(h)[0],tgt};}
  const opts=[{w:3,cmd:{k:'atk',tgt}}];
  for(const [id,s] of sks){
    let w=0;
    if(s.k==='phys'||s.k==='mag')w=3*((s.t==='all'||s.t==='rand')&&foes.length>1?1.4:1)*(s.sleepx&&foes.some(f=>f.sts.sleep)?1.6:1);
    else if(s.k==='stat'){const ty=s.st.map(x=>x[0]);w=foes.some(f=>ty.some(t=>!f.sts[t])&&!has(f,'mueki'))?1.3:0;}
    else if(s.k==='buff'){
      if(s.buff){const tg=s.t==='self'?[c]:mates.filter(alive);w=tg.some(t=>Object.keys(s.buff).some(k=>t.stg[k]<2))?.9:0;}
      else if(s.debuff)w=foes.some(f=>Object.keys(s.debuff).some(k=>f.stg[k]>-2))?.9:0;
      else if(s.evade)w=c.evade>0?0:.7;
    }
    if(w>0)opts.push({w,cmd:{k:'sk',id,tgt}});
  }
  return wpick(opts).cmd;
}

function fx(c,type){B.fx={uid:c.mon.uid,type};}
function pop(c,t,k){(B.pops=B.pops||[]).push({uid:c.mon.uid,t,k});}
function damage(t,d){
  if(d>1&&has(t,'sousei'))d=Math.max(1,Math.floor(d*.7));else if(d>1&&has(t,'shishin'))d=Math.max(1,Math.floor(d*.85));
  if(t.guard&&d>1)d=Math.max(1,Math.ceil(d/2));
  if(d>1&&has(t,'kago'))d=Math.max(1,Math.floor(d*.8));
  t.hp-=d;fx(t,'hit');pop(t,'-'+d,'dmg');sfx('hit');log(`${t.label}に${d}のダメージ！`);
  if(t.sts.sleep&&t.hp>0){delete t.sts.sleep;log(`${t.label}は目をさました！`);}
  if(t.hp<=0){
    if((t.shib||0)<tl(t,'shibutoi')){t.shib=(t.shib||0)+1;t.hp=1;log(`${t.label}はしぶとく持ちこたえた！`);}
    else{t.hp=0;t.sts={};log(t.side==='enemy'?`${t.label}をたおした！`:`${t.label}はたおれてしまった！`);}
  }
}
function heal(t,amt,msg){
  const b=t.hp;t.hp=Math.min(t.st.hp,t.hp+Math.max(0,amt));
  if(t.hp>b){fx(t,'healfx');pop(t,'+'+(t.hp-b),'heal');sfx('heal');log(msg||`${t.label}のHPが${t.hp-b}回復した`);}
}
function inflict(t,type,ch,loud){
  if(!alive(t))return;
  if(has(t,'mueki')||has(t,'metalbody')||has(t,'kago')||has(t,'sousei')){if(loud)log(`${t.label}には効かなかった！`);return;}
  if(t.sts[type]){if(loud)log(`${t.label}はすでに${STN[type]}になっている`);return;}
  const r=SP[t.mon.sp].rank;
  const p=ch*(r>=5?.6:r===4?.8:1)*(t.boss?.5:1)*(has(t,'shishin')?.5:1);
  if(Math.random()<p){t.sts[type]=STTURN[type];pop(t,STN[type],'st');log(t.label+STMSG[type]);}
  else if(loud)log(`${t.label}には効かなかった！`);
}
function stage(t,k,v){
  const b=t.stg[k];t.stg[k]=clamp(b+v,-2,2);
  if(t.stg[k]===b){log(`${t.label}の${STL[k]}はもう変わらない`);return;}
  log(`${t.label}の${STL[k]}が${v>0?'上がった':'下がった'}！`);
}
function hitPhys(a,t,pow,o={}){
  if(a.sts.blind&&Math.random()<.5){pop(t,'MISS','miss');log(`しかし${a.label}の攻撃は外れた！`);return 0;}
  if(t.evade>0&&Math.random()<.45){pop(t,'MISS','miss');log(`${t.label}はひらりとかわした！`);return 0;}
  const A=atkV(a),D=defV(t);
  const crit=Math.random()<.04+[0,.12,.25][tl(a,'kaishin')]+(o.crit||0);
  let d=crit?A*.8*pow/100*1.3:A*(A/(A+D))*.8*pow/100;
  d*=rnd(.88,1.12)*[1,.75,.6][tl(t,'koura')];
  d=Math.max(1,Math.floor(d));
  if(has(t,'metalbody')&&!crit)d=o.pierce?ri(2,4):(Math.random()<.5?1:0);
  if(crit){log('会心の一撃！');B.flash=true;sfx('crit');}
  damage(t,d);
  if(has(a,'kyuuketsu')&&alive(a))heal(a,Math.floor(d*(tl(a,'kyuuketsu')===2?.3:.15)),`${a.label}は体力を吸い取った`);
  if(alive(a)){
    if(has(t,'houshi')&&Math.random()<(tl(t,'houshi')===2?.55:.3)&&!a.sts.confuse&&!has(a,'mueki')&&!has(a,'kago')){a.sts.confuse=STTURN.confuse;log(`${a.label}は胞子を吸いこみ、幻覚を見はじめた！`);}
    if(has(t,'dokukarada')&&Math.random()<(tl(t,'dokukarada')===2?.55:.3))inflict(a,'poison',1);
    if(has(t,'tsumetai')&&Math.random()<(tl(t,'tsumetai')===2?.5:.25))inflict(a,'para',1);
  }
  return d;
}
function magDmg(c,t,sk){
  if(has(t,'metalbody')){log(`${t.label}は呪文をはじき返した！`);return 0;}
  const res=sk.e?(FAM[SP[t.mon.sp].fam].res[sk.e]||1):1;
  if(res>1)log('効果はばつぐんだ！');else if(res<1)log('あまり効いていないようだ…');
  const v=(sk.b*.7+c.st.int*.25)*res*(sk.e==='光'?[1,1.3,1.6][tl(c,'hakkou')]:1)*[1,1.25,1.5][tl(c,'maryoku')]*rnd(.9,1.1);
  return Math.max(1,Math.floor(v));
}
function sideFx(sk,t){
  if(sk.st)for(const [s,p] of sk.st)inflict(t,s,p,false);
  if(sk.debuff&&alive(t)&&Math.random()<(sk.dch||1))for(const [k,v] of Object.entries(sk.debuff))stage(t,k,v);
}
async function basicAttack(c,t){
  log(`${c.label}のこうげき！`);
  const hits=[1,2,3][tl(c,'renzoku')];
  for(let h=0;h<hits;h++){if(!alive(t))break;hitPhys(c,t,[100,70,55][hits-1]);}
}
async function useSkill(c,sk,cmd){
  c.mp-=sk.mp;log(`${c.label}の${sk.n}！`);
  const foes=foesOf(c),mates=matesOf(c);
  if(sk.k==='phys'||sk.k==='mag'||sk.k==='stat'){
    if(sk.t==='rand'){
      for(let h=0;h<(sk.hits||1);h++){const al=foes.filter(alive);if(!al.length)break;const t=pick(al);const d=hitPhys(c,t,sk.p,{crit:sk.crit,pierce:sk.pierce});if(d>0)sideFx(sk,t);render();await wait(160);}
      return;
    }
    const ts=sk.t==='all'?foes.filter(alive):[pickT(foes,cmd.tgt)].filter(Boolean);
    for(const t of ts){
      if(!alive(t))continue;
      if(sk.k==='phys'){
        for(let h=0;h<(sk.hits||1);h++){
          if(!alive(t))break;
          const d=hitPhys(c,t,sk.p*(sk.sleepx&&t.sts.sleep?sk.sleepx:1),{crit:sk.crit,pierce:sk.pierce});
          if(d>0){
            if(sk.drain&&alive(c))heal(c,Math.floor(d*sk.drain),`${c.label}は体力を吸い取った`);
            if(sk.coin&&c.side==='ally'){const y=ri(3,12)+c.mon.lv;state.yen+=y;log(`小銭を${y}円拾った！`);}
            sideFx(sk,t);
          }
        }
      } else if(sk.k==='mag'){damage(t,magDmg(c,t,sk));sideFx(sk,t);}
      else for(const [s,p] of sk.st)inflict(t,s,p,true);
      if(ts.length>1){render();await wait(220);}
    }
  } else if(sk.k==='buff'){
    if(sk.buff){const ts=sk.t==='self'?[c]:mates.filter(alive);for(const t of ts)for(const [k,v] of Object.entries(sk.buff))stage(t,k,v);}
    if(sk.debuff){for(const t of foes.filter(alive))if(Math.random()<(sk.dch||1))for(const [k,v] of Object.entries(sk.debuff))stage(t,k,v);}
    if(sk.evade){c.evade=sk.evade;log(`${c.label}は身をかわす構えをとった`);}
  } else if(sk.k==='heal'){
    if(sk.t==='revive'){
      const d=mates.find(x=>x.hp<=0&&!x.gone);
      if(!d){log('しかし何も起こらなかった');return;}
      d.hp=Math.floor(d.st.hp*.5);d.sts={};fx(d,'healfx');log(`${d.label}が生き返った！`);return;
    }
    const ts=sk.t==='allies'?mates.filter(alive):sk.t==='self'?[c]:[lowest(mates)];
    for(const t of ts){if(!t)continue;heal(t,sk.pct?Math.floor(t.st.hp*sk.pct):Math.floor(sk.b+c.st.int*.3));if(sk.cure&&Object.keys(t.sts).length){t.sts={};log(`${t.label}の状態異常が治った`);}}
  }
}
function useItemBattle(c,id){
  if(!state.items[id]){log(`${ITEMS[id].n}はもう残っていない！`);return;}
  state.items[id]--;log(`${c.label}は${ITEMS[id].n}を使った！`);
  const ms=B.allies.filter(alive);
  if(id==='bansoko')heal(lowest(B.allies),45);
  else if(id==='tea'){const t=ms.find(x=>Object.keys(x.sts).length)||lowest(B.allies);t.sts={};log(`${t.label}の状態異常が治った`);heal(t,20);}
  else if(id==='drink'){const t=ms.sort((x,y)=>x.mp/x.st.mp-y.mp/y.st.mp)[0];const b=t.mp;t.mp=Math.min(t.st.mp,t.mp+20);log(`${t.label}のMPが${t.mp-b}回復した`);}
  else if(id==='onigiri'){B.onigiri=true;log('おにぎりを差し出した。魔生物たちが気にしている…');}
}
async function act(c,cmd){
  if(c.side==='enemy'&&has(c,'metalbody')&&Math.random()<.35){c.gone=true;c.fled=true;log(`${c.label}は逃げ出した！`);return;}
  if(c.sts.sleep){
    c.sts.sleep--;
    if(c.sts.sleep<=0||Math.random()<.25){delete c.sts.sleep;log(`${c.label}は目をさました！`);}
    else{log(`${c.label}は眠っている…`);return;}
  }
  if(c.sts.para){
    c.sts.para--;const stuck=Math.random()<.6;if(c.sts.para<=0)delete c.sts.para;
    if(stuck){log(`${c.label}はしびれて動けない！`);return;}
  }
  if(c.sts.confuse){
    c.sts.confuse--;
    if(c.sts.confuse<=0){delete c.sts.confuse;log(`${c.label}は正気に戻った！`);}
    else if(Math.random()<.5){
      const pool=[...B.allies,...B.enemies].filter(x=>alive(x)&&x!==c);
      if(pool.length){log(`${c.label}は幻覚を見ている！`);await basicAttack(c,pick(pool));return;}
    }
  }
  if(cmd.k==='guard'){log(`${c.label}は身を守っている。`);return;}
  if(cmd.k==='item')return useItemBattle(c,cmd.id);
  if(cmd.k==='sk'){
    const sk=SK[cmd.id];
    if(sk&&c.mp>=sk.mp)return useSkill(c,sk,cmd);
    if(sk)log(`${c.label}はMPが足りない！`);
  }
  const t=pickT(foesOf(c),cmd.tgt);if(t)await basicAttack(c,t);
}
function endTick(c){
  if(c.sts.poison){
    const d=Math.max(1,Math.floor(c.st.hp/10));c.hp-=d;log(`${c.label}は毒で${d}のダメージ`);
    c.sts.poison--;if(c.sts.poison<=0)delete c.sts.poison;
    if(c.hp<=0){c.hp=0;c.sts={};log(c.side==='enemy'?`${c.label}をたおした！`:`${c.label}はたおれてしまった！`);return;}
  }
  if(has(c,'sousei')&&c.hp<c.st.hp)heal(c,Math.max(1,Math.floor(c.st.hp*.05)),`${c.label}は創世の息吹で回復した`);
  if(has(c,'shizen')&&c.hp<c.st.hp)heal(c,Math.max(1,Math.floor(c.st.hp*(tl(c,'shizen')===2?.12:.06))),`${c.label}の傷がふさがっていく`);
  if(has(c,'mpkaifuku'))c.mp=Math.min(c.st.mp,c.mp+(tl(c,'mpkaifuku')===2?4+Math.floor(c.mon.lv/6):2+Math.floor(c.mon.lv/10)));
  if(c.evade>0)c.evade--;

}
function scoutP(t){
  if(!t||t.boss||(B&&B.trainer))return 0;
  const al=B.allies.filter(alive);const lv=al.reduce((s,c)=>s+c.mon.lv,0)/Math.max(1,al.length);
  const base=[.42,.34,.27,.2,.14,.08,.05,.03][SP[t.mon.sp].rank];
  return Math.min(.92,base*(has(t,'metalbody')?.15:1)*(1+1.6*(1-t.hp/t.st.hp))*clamp(lv/t.mon.lv,.6,1.4)*(B.onigiri?1.6:1));
}
async function doScout(){
  const t=pickT(B.enemies,B.target);if(!t)return;
  log(`なかまたちは${t.label}にいいところを見せようとしている…`);render();await wait(650);
  if(t.boss||B.trainer){log(B.trainer?'ほかのブリーダーの魔生物はスカウトできない！':`${t.label}はまったく相手にしない！(ぬしはスカウトできない)`);return;}
  if(Math.random()<scoutP(t)){
    t.gone=true;const m=t.mon;m.uid=state.uidN++;const s=calc(m);m.hp=s.hp;m.mp=s.mp;
    addMon(m);sfx('scout');
    log(`${t.label}は起き上がり、なかまになりたそうにこちらを見ている！`);
    log(`${SP[m.sp].name}がなかまになった！${state.party.includes(m)?'':'(あずかり所へ送った)'}`);
  } else log(`${t.label}はそっぽを向いた…`);
  render();await wait(400);

function syncAllies(){for(const c of B.allies){c.mon.hp=Math.max(0,c.hp);c.mon.mp=c.mp;}}
async function runTurn(mode){
  if(!B||B.phase!=='input')return;
  B.phase='busy';B.menu='main';render();
  const list=[];
  if(mode==='scout'){await doScout();if(checkEnd())return;}
  else if(mode==='flee'){
    if(B.boss||B.rival||B.cup)log(B.boss?'ぬしからは逃げられない！':'勝負の最中に逃げることはできない！');
    else{
      const aa=B.allies.filter(alive),ee=B.enemies.filter(alive);
      const av=x=>x.reduce((s,c)=>s+agiV(c),0)/Math.max(1,x.length);
      if(Math.random()<clamp(.55+(av(aa)-av(ee))/200,.3,.92)){log('うまく逃げきれた！');syncAllies();B.phase='end';B.result={flee:true,lines:[]};save();render();return;}
      log('しかし回りこまれてしまった！');
    }
    render();await wait(400);
  }
  else B.allies.forEach((c,i)=>{if(alive(c)){const cmd=B.cmds[i]||{k:'atk',tgt:B.target};if(cmd.k==='guard'&&!c.sts.sleep&&!c.sts.para){c.guard=true;log(`${c.label}は守りをかためた！`);}list.push({c,cmd});}});
  if(B.allies.some(c=>c.guard)){render();await wait(300);}
  B.enemies.forEach(c=>{if(alive(c))list.push({c,cmd:null});});
  list.forEach(x=>x.s=agiV(x.c)*rnd(.85,1.15));
  list.sort((a,b)=>b.s-a.s);
  for(const x of list){
    if(!B||!alive(x.c))continue;
    B.actor=x.c.mon.uid;await act(x.c,x.cmd||ai(x.c));
    render();await wait(420);
    if(checkEnd())return;
  }
  B.actor=null;B.allies.forEach(c=>c.guard=false);for(const c of [...B.allies,...B.enemies])if(alive(c))endTick(c);
  render();
  if(checkEnd())return;
  B.turn++;B.cmds=[];B.phase='input';B.inputIdx=nextInput(-1);render();
  if(B.auto)setTimeout(()=>{if(B&&B.auto&&B.phase==='input')autoTurn();},350);
}
function checkEnd(){
  if(B.phase==='end')return true;
  if(!B.enemies.some(alive)){win();return true;}
  if(!B.allies.some(alive)){lose();return true;}
  return false;
}
function win(){
  B.phase='end';B.auto=false;
  const def=B.enemies.filter(c=>c.hp<=0&&!c.gone);
  let exp=0,yen=0;
  for(const c of def){const r=SP[c.mon.sp].rank,lv=c.mon.lv;exp+=Math.floor(3.5*Math.pow(lv,1.5)*(1+.25*r)*(c.boss?3:B.trainer?1.5:1)*(SP[c.mon.sp].expx||1));yen+=Math.floor(lv*2.5*(1+.3*r))+ri(0,5);}
  const BB=B.boss?(B.ura?TOWN[B.town].ura:TOWN[B.town].boss):null;
  if(BB)yen+=BB.reward;
  syncAllies();
  const lines=[];
  const drops=[];for(const c of def){const x=SP[c.mon.sp].expx;if(x&&Math.random()<x/160){state.items.saino=(state.items.saino||0)+1;drops.push(`${SP[c.mon.sp].name}が才能のかけらを落としていった！`);}}
  if(def.length)lines.push(`${exp}の経験値と${yen}円を手に入れた！`);else lines.push(B.enemies.some(c=>c.fled)?'魔生物は逃げてしまった……':'スカウトに成功して、戦いが終わった。');
  lines.push(...drops);
  for(const c of B.allies)if(c.hp>0)gainExp(c.mon,exp,lines);
  const care=(state.daycare||[]).map(findMon).filter(m=>m&&state.box.includes(m));
  if(care.length&&exp>0){const ln=[];care.forEach(m=>gainExp(m,Math.floor(exp/2),ln));lines.push(`育て屋の${care.map(mName).join('・')}も経験値を得た。`+(ln.some(l=>l.includes('レベル'))?'(レベルアップ！)':''));}
  if(exp>0)state.box.forEach(m=>{if(!care.includes(m))gainExp(m,Math.floor(exp/4),[]);});
  state.yen+=yen;
  if(B.boss){
    const tid=B.ura?B.town+'_ura':B.town,first=!state.boss[tid];state.boss[tid]=true;
    if(first){const g=B.ura?500:300;addStars(g);lines.push(`流星石★${g}を手に入れた！`);lines.push(BB.clear);for(const [k,n] of Object.entries(BB.drops||{})){state.items[k]=(state.items[k]||0)+n;lines.push(`配合研究所から${ITEMS[k].n}を${n}個もらった！`);}if(STORY['boss_'+tid])B.after=()=>talk(STORY['boss_'+tid]);}
    else if(B.ura&&Math.random()<.3){state.items.saino=(state.items.saino||0)+1;lines.push('雲海に才能のかけらが落ちていた！');}
  }
  if(B.rival){const r=RIVALS[B.rival];if(!state.rival[B.rival]){state.rival[B.rival]=true;lines.push(`アオイから ${giveReward(r.reward)} を受け取った。`);}B.after=()=>talk(r.post);}
  if(B.cup){
    const cup=CUP[B.cup.id];
    if(B.cup.round<3){B.next={id:cup.id,round:B.cup.round+1};lines.push(`第${B.cup.round}試合に勝利！ HPとMPはそのままで次の試合へ。`);}
    else{
      const first=!state.cups[cup.id];state.cups[cup.id]=true;lines.push(`${cup.name} 優勝！`);
      if(first){lines.push(`賞品: ${giveReward(cup.reward)}`);addStars(200);lines.push('流星石★200を手に入れた！');}else{const y=Math.floor(cup.reward.yen/4);state.yen+=y;lines.push(`賞金 ${y.toLocaleString()}円`);}
      healAll();lines.push('会場の医務室で、なかまが回復した。');B.after=()=>talk(STORY.cup);
    }
  }
  if(def.length)dailyInc('win');
  if(B.tower){
    const n=B.tower,first=n>(state.tower||0);
    if(first){state.tower=n;const rw=towerReward(n);addStars(rw.stars);lines.push(`${n}階を初めて踏破！ 流星石★${rw.stars}を手に入れた！`);
      if(rw.kakusei){state.items.kakusei=(state.items.kakusei||0)+1;lines.push('覚醒の宝珠を手に入れた！');}
      if(rw.tenpu){state.items.tenpu=(state.items.tenpu||0)+1;lines.push('天賦の宝珠を手に入れた！');}}
    else{addStars(5);lines.push('流星石★5を手に入れた。');}
    B.next={tower:n+1};
  }
  B.result={win:true,lines};save();sfx(lines.some(l=>l.includes('レベル'))?'lvup':'win');render();
}
function lose(){

  else if(B.tower)lines=[`星界の塔${B.tower}階で力つきてしまった……`,'塔の入口で目をさました。なかまは回復している。'];
  else{const lost=Math.floor(state.yen/2);state.yen-=lost;lines=['目の前がまっくらになった……',`${lost}円を落としてしまった。`,`${TOWN[state.town].sento}で目をさました。なかまは回復している。`];}

function stChips(c){

function explore(fid){
  const t=TOWN[state.town],f=t.fields.find(x=>x.id===fid);if(!f)return;
  state.steps=(state.steps||0)+1;dailyInc('ex');
  let tmsg='';if(state.steps>=4){advanceTime();tmsg=`時間が過ぎて、${TIMES[state.time].n}になった。`;}
  if(Math.random()<.12){
    let msg;
    if(TOWNS.indexOf(t)>=3&&Math.random()<.05){state.items.saino=(state.items.saino||0)+1;msg=`${f.name}で才能のかけらを見つけた！`;sfx('shiny');}
    else if(Math.random()<.5){const y=ri(20,60)*(TOWNS.indexOf(t)+1);state.yen+=y;msg=`${f.name}で${y}円を拾った！`;}
    else{const k=pick(['bansoko','bansoko','tea','onigiri','drink']);state.items[k]++;msg=`${f.name}で${ITEMS[k].n}を見つけた！`;}
    ui.toast=msg+(tmsg?' '+tmsg:'');save();render();return;
  }
  ui.toast=tmsg;
  const n=Math.min(f.max,wpick([{w:5,v:1},{w:3.5,v:2},{w:1.5,v:3}]).v);
  const tb=f.table.filter(([,,tm])=>timeOK(tm,state.time)).map(([s,w])=>({w,s}));
  const foes=[];for(let i=0;i<n;i++)foes.push([wpick(tb).s,ri(f.lv[0],f.lv[1])]);
  const mrate=.035*((state.lure||0)>0?4:1);if(state.lure>0)state.lure--;
  if(Math.random()<mrate){const pool={komorebi:['haganetsubu','koganetsubu','koganetsubu'],kasumi:['haganetsubu','koganetsubu'],shiomi:['haganetsubu','gintachi','gintachi'],tengu:['gintachi','nijitama','nijitama'],mayoiga:['nijitama','nijitama','gintachi'],ryuhyo:['nijitama','gintachi','nijitama']}[t.id]||['haganetsubu'];foes[0]=[pick(pool),ri(f.lv[0],f.lv[1])];}
  startBattle(foes,{field:`${t.name}・${f.name}`,scene:f.scene});
}
